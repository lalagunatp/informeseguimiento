<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reporte de seguimiento · La Laguna</title>
<style>
  :root{

    --line:#d8dee6; --line2:#eaeef3;
    --azul:#123a5e; --azul2:#1d5b8f; --rojo:#c8102e;

  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:14px; line-height:1.35;
  }
  header{
    background:var(--azul); color:#fff; padding:14px 16px 12px;
    border-bottom:3px solid var(--rojo);
  }
  header h1{margin:0; font-size:17px; letter-spacing:.2px; font-weight:650}
  header p{margin:3px 0 0; font-size:12px; color:#b9cbdc}
  .barra{
    position:sticky; top:0; z-index:30; background:#fff; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:12px; padding:8px 12px;
  }
  .hamb{
    width:38px; height:34px; padding:0; background:#fff; border:1px solid var(--line);
    display:flex; flex-direction:column; justify-content:center; align-items:center; gap:4px; border-radius:8px;

  .vistas{display:flex; gap:6px}

    padding:6px 15px; font-size:13px; border-radius:20px;
  }
  .vistas button.on{background:var(--azul); color:#fff; border-color:var(--azul)}
  .fondo{position:fixed; inset:0; background:rgba(16,26,38,.35); z-index:39}
  .cajon{
    position:fixed; top:0; left:0; bottom:0; width:min(310px, 84vw); z-index:40; background:#fff;
    border-right:1px solid var(--line); box-shadow:2px 0 18px rgba(16,26,38,.18);

  }
  .cajon-tit{
    display:flex; justify-content:space-between; align-items:center; gap:8px;

  #menu{overflow-y:auto; padding:8px 0 20px}

  }

  .panel{scroll-margin-top:56px}
  .wrap{max-width:1400px; margin:0 auto; padding:14px 12px 60px}
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:10px; margin-bottom:14px}
  .panel > h2{
    margin:0; padding:10px 14px; font-size:12px; letter-spacing:1.1px;
    text-transform:uppercase; color:var(--azul); border-bottom:1px solid var(--line2);

  label.campo{display:flex; flex-direction:column; gap:4px; font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted)}
  select,input[type=text]{

</style>

<script>
"use strict";

/* ---------- utilidades de fecha ---------- */

function soloFecha(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

function isoSemana(d){
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dn = (t.getUTCDay() + 6) % 7;          // 0 = lunes
  t.setUTCDate(t.getUTCDate() - dn + 3);       // jueves de esa semana
  const anio = t.getUTCFullYear();
  const primerJue = new Date(Date.UTC(anio, 0, 4));
  const dn2 = (primerJue.getUTCDay() + 6) % 7;
  primerJue.setUTCDate(primerJue.getUTCDate() - dn2 + 3);
  const sem = 1 + Math.round((t - primerJue) / (7 * 86400000));
  return anio + "-" + String(sem).padStart(2, "0");
}
function lunesDe(clave){
  const [anio, sem] = clave.split("-").map(Number);
  const primerJue = new Date(anio, 0, 4);
  const dn = (primerJue.getDay() + 6) % 7;
  const lunesS1 = new Date(primerJue.getFullYear(), primerJue.getMonth(), primerJue.getDate() - dn);
  return new Date(lunesS1.getFullYear(), lunesS1.getMonth(), lunesS1.getDate() + (sem - 1) * 7);
}
function claveAnterior(clave){
  const l = lunesDe(clave);
  return isoSemana(new Date(l.getFullYear(), l.getMonth(), l.getDate() - 7));
}
function etiquetaSemana(clave){
  const [anio, sem] = clave.split("-");
  return anio + " " + Number(sem);
}
function diaIndice(d){ return (d.getDay() + 6) % 7; }   // 0 = lunes … 6 = domingo
const DIAS = ["lun","mar","mié","jue","vie","sáb","dom"];
const NOMBRE_MES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function fCorta(d){
  return String(d.getDate()).padStart(2,"0") + "/" + String(d.getMonth()+1).padStart(2,"0") + "/" + d.getFullYear();
}

/* ---------- lectura de la hoja (gviz por JSONP: funciona incluso abriendo el archivo local) ---------- */

function consultaGviz(id, destino, tq, segundos, encabezados){
  return new Promise(function(res, rej){
    const cb = "tp" + Math.random().toString(36).slice(2, 10);
    const s = document.createElement("script");
    let temporizador = null;
    function limpiar(){
      if (temporizador) clearTimeout(temporizador);
      try { delete window[cb]; } catch(e){ window[cb] = undefined; }
      if (s.parentNode) s.parentNode.removeChild(s);
    }
    window[cb] = function(r){
      limpiar();
      if (r && r.status === "error"){
        const d = r.errors && r.errors[0] ? (r.errors[0].detailed_message || r.errors[0].message) : "error desconocido";
        rej(new Error(d.replace(/<[^>]+>/g, "")));
      } else if (!r || !r.table){
        rej(new Error("La hoja respondió sin datos"));
      } else {
        res(r.table);
      }
    };
    let url = "https://docs.google.com/spreadsheets/d/" + encodeURIComponent(id) +
              "/gviz/tq?tqx=out:json;responseHandler:" + cb +
              "&headers=" + (encabezados === undefined ? 1 : encabezados);
    const dest = (destino || "").toString().trim();
    if (dest){
      // acepta el gid suelto, la URL con #gid=... o el nombre de la pestaña
      const m = /[?&#]gid=(\d+)/.exec(dest);
      const g = m ? m[1] : (/^\d+$/.test(dest) ? dest : null);
      url += g ? "&gid=" + g : "&sheet=" + encodeURIComponent(dest);
    }
    url += "&tq=" + encodeURIComponent(tq);
    s.src = url;
    s.onerror = function(){ limpiar(); rej(new Error("No se pudo conectar con la hoja. Revisa el ID y que esté compartida como 'cualquiera con el enlace'.")); };
    temporizador = setTimeout(function(){ limpiar(); rej(new Error("La hoja tardó demasiado en responder")); }, (segundos || 90) * 1000);
    document.head.appendChild(s);
  });
}

function normaliza(s){
  return String(s || "").trim().toUpperCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/\s+/g, " ");
}

/* ---------- estado ---------- */

const COLUMNAS = "C,D,E,F,H,I,K,M,N,O,P,Q,R,S,T,U,AF,AG,AH";
const IDX_SELECT = { cluster:0, creacion:1, validacion:2, activacion:3, canal:4, subcanal:5, estatus:6, estatus2:7, cuenta:8, plan:9, oportunidad:10, vendedor:11, pl:12, pp:13, addon:14, numvendedor:15, director:16, lider:17, coach:18 };
// posiciones reales A..AH, por si hay que leer la hoja completa
const IDX_TODO   = { cluster:2, creacion:3, validacion:4, activacion:5, canal:7, subcanal:8, estatus:10, estatus2:12, cuenta:13, plan:14, oportunidad:15, vendedor:16, pl:17, pp:18, addon:19, numvendedor:20, director:31, lider:32, coach:33 };
let IDX = IDX_SELECT;

let FILAS = [];        // {cluster,canal,canalBase,subcanal,oportunidad,estatus,...,fOp,fVal,fIns}
let SEMANAS = [];      // claves ordenadas
let MESES = [];        // [{clave:"2026-07", etq:"julio 2026"}]
let MES_TOCADO = false;
let VISTA = "semana";
let FECHA_MAX = null;
let TEC_FILAS = [];             // renglones crudos [llave, clave] de la pestaña de venta técnico
let MAPA_TECNICO = new Map();   // llave -> 3 primeras letras (SKA, CRC, …)
let INFO_TECNICO = { estado:"sin cruce", n:0, sinCruce:0 };

const el = function(id){ return document.getElementById(id); };

function avisar(txt, esError){
  const a = el("estado");
  a.innerHTML = txt;
  a.className = "aviso" + (esError ? " error" : "");
  if (esError){
    const dt = document.querySelector("details.ajustes");
    if (dt) dt.open = true;
  }
}

/* ---------- fechas que llegan como texto ---------- */

function textoAFecha(s, orden){
  const m = /^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/.exec(s.trim());
  if (!m) return null;
  let a = Number(m[1]), b = Number(m[2]), y = Number(m[3]);
  if (y < 100) y += 2000;
  let dia, mes;
  if (orden === "mdy"){ mes = a; dia = b; } else { dia = a; mes = b; }
  if (mes < 1 || mes > 12 || dia < 1 || dia > 31) return null;
  const d = new Date(y, mes - 1, dia);
  return isNaN(d) ? null : d;
}

function detectarOrden(muestras){
  let dmy = 0, mdy = 0;
  for (const s of muestras){
    const m = /^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/.exec(s.trim());
    if (!m) continue;
    const a = Number(m[1]), b = Number(m[2]);
    if (a > 12) dmy++;
    if (b > 12) mdy++;
  }
  return mdy > dmy ? "mdy" : "dmy";
}

function valor(c){
  if (!c) return null;
  const v = c.v;
  if (v === null || v === undefined || v === "") return null;
  return v;
}
function numero(c){
  if (!c) return 0;
  const v = c.v;
  if (typeof v === "number") return v;
  const s = String(v === null || v === undefined ? "" : v).replace(/[^0-9.\-]/g, "");
  const n = Number(s);
  return isFinite(n) ? n : 0;
}

function texto(c){
  const v = valor(c);
  if (v === null) return "";
  const s = String(v).trim();
  return (s === "-" || s === "0") ? "" : s;
}

/* ---------- canal de ventas: se arma con reglas, no con catálogo ---------- */

function listaAjuste(id){
  return el(id).value.split(";").map(function(s){ return normaliza(s); }).filter(Boolean);
}

function sinCruzar(f){
  return normaliza(f.subcanal).indexOf("VENTA TECNICO") >= 0 &&
         !MAPA_TECNICO.has(llaveDe(f[el("cruceCampo").value]));
}

function canalDe(f){
  const sub = normaliza(f.subcanal);
  const can = normaliza(f.canalBase);

  if (sub === "CAMBACEO" || can === "CAMBACEO"){
    return listaAjuste("lideresLocales").indexOf(normaliza(f.lider)) >= 0 ? "Cambaceo" : "Cambaceo foráneo";
  }

  if (sub.indexOf("VENTA TECNICO") >= 0){
    const cve = MAPA_TECNICO.get(llaveDe(f[el("cruceCampo").value]));
    return (cve && listaAjuste("clavesTecnico").indexOf(cve) >= 0) ? "Venta técnico " + cve : "Venta técnico otros";
  }

  if (can === "PUNTO DE VENTA" || sub.indexOf("PUNTO DE VENTA") >= 0){
    const plazas = listaAjuste("plazasLocales");
    const local = plazas.some(function(p){ return sub.indexOf(p) >= 0; });
    return local ? "Punto de venta" : "Punto de venta foráneo";
  }

  return f.subcanal || f.canalBase || "SIN CANAL";
}

function clave(v){
  if (v === null || v === undefined) return "";
  let s = String(v).trim();
  if (/^\d+\.0+$/.test(s)) s = s.replace(/\.0+$/, "");   // 18913519.0 -> 18913519
  return s.toUpperCase();
}

function llaveDe(valor){
  return el("cruceCampo").value === "vendedor" ? normaliza(valor) : clave(valor);
}

function armarMapaTecnico(){
  MAPA_TECNICO = new Map();
  TEC_FILAS.forEach(function(par){
    const k = llaveDe(par[0]);
    const v = normaliza(par[1]).slice(0, 3);
    if (k && v.length >= 2) MAPA_TECNICO.set(k, v);
  });
  INFO_TECNICO.n = MAPA_TECNICO.size;
}

async function cargarMapaTecnico(id){
  TEC_FILAS = [];
  MAPA_TECNICO = new Map();
  INFO_TECNICO = { estado:"sin cruce", n:0, sinCruce:0, filas:0 };
  const destino = el("hojaTecnico").value.trim();
  if (!destino) return;
  const libro = el("idTecnico").value.trim() || id;
  const a = (el("colLlave").value.trim() || "E").toUpperCase();
  const b = (el("colClave").value.trim() || "F").toUpperCase();
  try{
    const t = await consultaGviz(libro, destino, "select " + a + ", " + b, 90, 0);
    (t.rows || []).forEach(function(r){
      const c = r.c || [];
      const k = c[0] && c[0].v != null ? String(c[0].v) : "";
      const v = c[1] && c[1].v != null ? String(c[1].v) : "";
      if (k.trim() && v.trim()) TEC_FILAS.push([k, v]);
    });
    INFO_TECNICO.filas = TEC_FILAS.length;
    // si llegan fechas en vez de oportunidades, se leyó otra pestaña
    const conFecha = TEC_FILAS.slice(0, 50).filter(function(p){ return /^Date\(/.test(p[0]) || /^Date\(/.test(p[1]); }).length;
    if (TEC_FILAS.length && conFecha > TEC_FILAS.slice(0, 50).length / 2){
      TEC_FILAS = [];
      INFO_TECNICO.estado = "pestaña equivocada";
      INFO_TECNICO.filas = 0;
      return;
    }
    armarMapaTecnico();
    INFO_TECNICO.estado = MAPA_TECNICO.size ? "ok" : "vacío";
  }catch(e){
    INFO_TECNICO.estado = "falló: " + e.message;
  }
}

function revisarCruce(){
  const caja = el("revision");
  caja.classList.remove("oculto");
  const campo = el("cruceCampo").value;
  const tecnicas = FILAS.filter(function(f){ return normaliza(f.subcanal).indexOf("VENTA TECNICO") >= 0; });
  const cruzadas = tecnicas.filter(function(f){ return MAPA_TECNICO.has(llaveDe(f[campo])); });
  const muestraHoja = TEC_FILAS.slice(0, 6).map(function(p){ return p[0] + " &nbsp;→&nbsp; " + p[1]; });
  const muestraBase = tecnicas.slice(0, 6).map(function(f){ return String(f[campo] || "(vacío)"); });
  const claves = Array.from(new Set(Array.from(MAPA_TECNICO.values()))).slice(0, 12);
  const nombreCampo = el("cruceCampo").options[el("cruceCampo").selectedIndex].text;

  caja.innerHTML =
    "<b>Pestaña " + (el("hojaTecnico").value.trim() || "—") + "</b>: " + INFO_TECNICO.filas.toLocaleString("es-MX") +
    " renglones con dato en las columnas " + el("colLlave").value + " y " + el("colClave").value +
    " · " + MAPA_TECNICO.size.toLocaleString("es-MX") + " llaves distintas." +
    "<br><br>Primeros renglones de esa pestaña (llave → clave):<br>" +
    (muestraHoja.length ? muestraHoja.join("<br>") : "ninguno") +
    "<br><br>Claves de 3 letras encontradas: <b>" + (claves.length ? claves.join(", ") : "ninguna") + "</b>" +
    "<br><br>En la base hay <b>" + tecnicas.length.toLocaleString("es-MX") + "</b> renglones de venta técnico y cruzaron <b>" +
    cruzadas.length.toLocaleString("es-MX") + "</b>." +
    "<br>Así se ve el dato que se está cruzando desde la base (" + nombreCampo + "):<br>" +
    (muestraBase.length ? muestraBase.join(" · ") : "ninguno") +
    "<br><br>Si las dos listas no se parecen, cambia en Ajustes la columna llave o el dato de la base que cruza.";
}

function reclasificarCanal(){
  armarMapaTecnico();
  let sinCruce = 0;
  FILAS.forEach(function(f){
    f.canal = canalDe(f);
    if (sinCruzar(f)) sinCruce++;
  });
  INFO_TECNICO.sinCruce = sinCruce;
  llenarMulti("canal");
  pintar();
}

async function cargar(){
  const id = el("hojaId").value.trim();
  const gid = el("hojaGid").value.trim();
  el("btnRecargar").disabled = true;
  avisar("Leyendo la pestaña de venta técnico…");
  await cargarMapaTecnico(id);
  avisar("Leyendo la base… en un archivo grande esto puede tardar medio minuto.");

  let tabla;
  try{
    tabla = await consultaGviz(id, gid, "select " + COLUMNAS, 120);
    IDX = IDX_SELECT;
  }catch(e1){
    try{
      avisar("Reintentando con todas las columnas…");
      tabla = await consultaGviz(id, gid, "select *", 150);
      IDX = IDX_TODO;
    }catch(e2){
      avisar("No se pudo leer la hoja. <b>" + e2.message + "</b>", true);
      el("btnRecargar").disabled = false;
      return;
    }
  }

  const filas = tabla.rows || [];
  // detectar el orden de las fechas cuando vienen como texto
  const muestras = [];
  for (let i = 0; i < filas.length && muestras.length < 4000; i++){
    const c = filas[i].c || [];
    [IDX.creacion, IDX.validacion, IDX.activacion].forEach(function(j){
      if (!c[j]) return;
      const v = c[j].v, f = c[j].f;
      if (typeof v === "string" && v.length >= 6 && !/^Date\(/.test(v)) muestras.push(v);
      if (typeof f === "string" && f.length >= 6) muestras.push(f);
    });
  }
  const orden = detectarOrden(muestras);

  function leerFecha(c){
    if (!c) return null;
    const v = c.v;
    if (v instanceof Date) return isNaN(v) ? null : soloFecha(v);
    if (typeof v === "string"){
      const g = /^Date\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/.exec(v);   // así entrega Google las fechas
      if (g) return new Date(Number(g[1]), Number(g[2]), Number(g[3]));
      const t = textoAFecha(v, orden);
      if (t) return t;
    }
    if (c.f) return textoAFecha(String(c.f), orden);                  // respaldo: el texto mostrado
    return null;
  }

  const nuevas = [];
  const semanas = new Set();
  let sinCruce = 0;
  let max = null;

  for (const f of filas){
    const c = f.c || [];
    const fOp  = leerFecha(c[IDX.creacion]);
    const fVal = leerFecha(c[IDX.validacion]);
    const fIns = leerFecha(c[IDX.activacion]);
    if (!fOp && !fVal && !fIns) continue;

    const reg = {
      cluster:  texto(c[IDX.cluster]),
      canalBase: texto(c[IDX.canal]),
      subcanal: texto(c[IDX.subcanal]),
      oportunidad: c[IDX.oportunidad] && c[IDX.oportunidad].v != null ? c[IDX.oportunidad].v : "",
      numvendedor: c[IDX.numvendedor] && c[IDX.numvendedor].v != null ? c[IDX.numvendedor].v : "",
      cuenta:      c[IDX.cuenta] && c[IDX.cuenta].v != null ? c[IDX.cuenta].v : "",
      estatus:  texto(c[IDX.estatus]),
      estatus2: texto(c[IDX.estatus2]),
      plan:     texto(c[IDX.plan]),
      vendedor: texto(c[IDX.vendedor]),
      pl:    numero(c[IDX.pl]),
      pp:    numero(c[IDX.pp]),
      addon: numero(c[IDX.addon]),
      director: texto(c[IDX.director]),
      lider:    texto(c[IDX.lider]),
      coach:    texto(c[IDX.coach]),
      fOp: fOp, fVal: fVal, fIns: fIns
    };
    reg.canal = canalDe(reg);
    if (sinCruzar(reg)) sinCruce++;
    nuevas.push(reg);

    [fOp, fVal, fIns].forEach(function(d){
      if (!d) return;
      semanas.add(isoSemana(d));
      if (!max || d > max) max = d;
    });
  }

  INFO_TECNICO.sinCruce = sinCruce;

  FILAS = nuevas;
  FECHA_MAX = max;
  SEMANAS = Array.from(semanas).sort();

  const mm = new Set();
  FILAS.forEach(function(f){
    [f.fOp, f.fVal, f.fIns].forEach(function(d){
      if (d) mm.add(d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"));
    });
  });
  MESES = Array.from(mm).sort().map(function(k){
    const y = Number(k.slice(0, 4)), m = Number(k.slice(5)) - 1;
    return { clave:k, etq: NOMBRE_MES[m] + " " + y };
  });
  if (!MES_TOCADO){
    const hoy = new Date();
    const k1 = hoy.getFullYear() + "-" + String(hoy.getMonth() + 1).padStart(2, "0");
    const ant = new Date(hoy.getFullYear(), hoy.getMonth() - 1, 1);
    const k2 = ant.getFullYear() + "-" + String(ant.getMonth() + 1).padStart(2, "0");
    const quiero = MESES.filter(function(x){ return x.clave === k1 || x.clave === k2; });
    const usar = quiero.length ? quiero : MESES.slice(-2);
    MULTI.mes.sel = new Set(usar.map(function(x){ return x.etq; }));
  }

  llenarSelectores();

  if (!FILAS.length){
    const c0 = (filas[0] && filas[0].c) || [];
    const muestra = [IDX.creacion, IDX.validacion, IDX.activacion].map(function(j){
      return c0[j] ? JSON.stringify(c0[j].v) : "vacío";
    }).join(" · ");
    avisar("La hoja respondió con <b>" + filas.length.toLocaleString("es-MX") + "</b> renglones, pero ninguno trae fecha reconocible.<br>" +
           "Columnas que llegaron: <b>" + (tabla.cols || []).length + "</b>. Primer renglón, columnas de creación/validación/activación: " +
           muestra + "<br>Si aquí no aparecen fechas, la pestaña que se está leyendo no es la BASE: pon el gid de la pestaña en Ajustes.", true);
    el("btnRecargar").disabled = false;
    return;
  }

  let nota = "";
  if (INFO_TECNICO.estado === "ok"){
    nota = "<br>Venta técnico cruzado con <b>" + el("hojaTecnico").value.trim() + "</b> (" + INFO_TECNICO.n.toLocaleString("es-MX") + " referencias)";
    if (INFO_TECNICO.sinCruce) nota += " · <b>" + INFO_TECNICO.sinCruce + "</b> ventas técnico sin cruce, se van a “Venta técnico otros”";
  } else if (INFO_TECNICO.estado === "pestaña equivocada"){
    nota = "<br><b>Google devolvió otra pestaña</b>: en las columnas " + el("colLlave").value + " y " + el("colClave").value +
           " llegaron fechas, no oportunidades. Abre la pestaña VENTA TECNICO en Google Sheets, copia el <b>gid</b> de la barra de direcciones " +
           "(la parte gid=…) y pégalo en Ajustes en lugar del nombre.";
  } else if (INFO_TECNICO.estado !== "sin cruce"){
    nota = "<br>No se pudo leer la pestaña de venta técnico (" + INFO_TECNICO.estado + "): esas ventas salen como “Venta técnico otros”.";
  }

  avisar("<b>" + FILAS.length.toLocaleString("es-MX") + "</b> registros con fecha, de " + filas.length.toLocaleString("es-MX") + " renglones · fechas en formato " +
         (orden === "mdy" ? "mes/día/año" : "día/mes/año") +
         (max ? " · último movimiento el <b>" + fCorta(max) + "</b> (semana " + etiquetaSemana(isoSemana(max)) + ")" : "") + nota);
  el("btnRecargar").disabled = false;
  pintar();
}

function llenarSelectores(){
  const sem = el("semana");
  const previo = sem.value;
  sem.innerHTML = "";
  SEMANAS.slice().reverse().forEach(function(k){
    const o = document.createElement("option");
    o.value = k;
    o.textContent = "Semana " + etiquetaSemana(k) + "  ·  " + fCorta(lunesDe(k)) + " al " + fCorta(new Date(lunesDe(k).getFullYear(), lunesDe(k).getMonth(), lunesDe(k).getDate() + 6));
    sem.appendChild(o);
  });
  sem.value = (previo && SEMANAS.indexOf(previo) >= 0) ? previo : (FECHA_MAX ? isoSemana(FECHA_MAX) : SEMANAS[SEMANAS.length - 1]);

  llenarMulti("director");
  llenarMulti("lider");
  llenarMulti("canal");
  llenarMulti("plan");
  llenarMulti("mes");
}

/* ---------- filtros de selección múltiple ---------- */

const MULTI = {
  director: { contId:"fDirector", sel:new Set(), valores:[] },
  lider:    { contId:"fLider",    sel:new Set(), valores:[] },
  canal:    { contId:"fCanal",    sel:new Set(), valores:[] },
  plan:     { contId:"fPlan",     sel:new Set(), valores:[] },
  mes:      { contId:"fMes",      sel:new Set(), valores:[], manual:true }
};

function armarMulti(campo){
  const m = MULTI[campo];
  if (m.armado) return;
  const c = el(m.contId);
  c.className = "multi";
  c.innerHTML =
    '<button type="button" class="multi-btn"><span class="etq">Todos</span><span class="flecha">▾</span></button>' +
    '<div class="multi-panel oculto">' +
      '<div class="multi-acc"><button type="button" data-acc="todos">Todos</button>' +
      '<button type="button" data-acc="solo">Quitar todos</button></div>' +
      '<div class="multi-busca"><input type="text" placeholder="Buscar\u2026"></div>' +
      '<div class="multi-lista"></div>' +
    "</div>";
  m.btn = c.querySelector(".multi-btn");
  m.etq = c.querySelector(".etq");
  m.panel = c.querySelector(".multi-panel");
  m.lista = c.querySelector(".multi-lista");
  m.busca = c.querySelector(".multi-busca input");
  m.busca.addEventListener("input", function(){ filtrarMulti(campo); });
  m.busca.addEventListener("click", function(ev){ ev.stopPropagation(); });

  m.btn.addEventListener("click", function(ev){
    ev.preventDefault(); ev.stopPropagation();
    const abierto = !m.panel.classList.contains("oculto");
    cerrarMultis();
    if (!abierto){
      m.panel.classList.remove("oculto");
      m.btn.classList.add("activo");
      m.busca.value = "";
      filtrarMulti(campo);
      try { m.busca.focus(); } catch(e){}
    }
  });
  m.panel.addEventListener("click", function(ev){ ev.stopPropagation(); });
  c.querySelectorAll("[data-acc]").forEach(function(b){
    b.addEventListener("click", function(ev){
      ev.preventDefault();
      m.sel = b.getAttribute("data-acc") === "todos" ? new Set(m.valores) : new Set(["\u0000"]);
      if (campo === "mes") MES_TOCADO = true;
      pintarMulti(campo);
      cascada(campo);
      pintar();
    });
  });
  m.armado = true;
}

function llenarMulti(campo){
  armarMulti(campo);
  const m = MULTI[campo];
  if (m.manual){
    m.valores = MESES.map(function(x){ return x.etq; });
  } else {
    m.valores = Array.from(new Set(FILAS.filter(function(f){
      return visiblePara(campo, f);
    }).map(function(f){ return f[campo]; }).filter(Boolean))).sort(function(a,b){ return a.localeCompare(b, "es"); });
  }

  // conservar solo lo que sigue existiendo
  const nueva = new Set();
  m.sel.forEach(function(v){ if (v === "\u0000" || m.valores.indexOf(v) >= 0) nueva.add(v); });
  m.sel = nueva;

  m.lista.innerHTML = "";
  m.valores.forEach(function(v){
    const lab = document.createElement("label");
    const chk = document.createElement("input");
    chk.type = "checkbox";
    chk.checked = m.sel.has(v);
    chk.addEventListener("change", function(){
      m.sel.delete("\u0000");
      if (chk.checked) m.sel.add(v); else m.sel.delete(v);
      if (campo === "mes") MES_TOCADO = true;
      pintarMulti(campo);
      cascada(campo);
      pintar();
    });
    const txt = document.createElement("span");
    txt.textContent = v;
    lab.appendChild(chk); lab.appendChild(txt);
    m.lista.appendChild(lab);
  });
  filtrarMulti(campo);
  pintarMulti(campo);
}

function filtrarMulti(campo){
  const m = MULTI[campo];
  const q = normaliza(m.busca ? m.busca.value : "");
  let visibles = 0;
  Array.prototype.forEach.call(m.lista.children, function(lab){
    const ok = !q || normaliza(lab.textContent).indexOf(q) >= 0;
    lab.style.display = ok ? "" : "none";
    if (ok) visibles++;
  });
  m.lista.setAttribute("data-vacio", visibles ? "" : "1");
}

function pintarMulti(campo){
  const m = MULTI[campo];
  let t;
  if (m.sel.has("\u0000")) t = "Ninguno";
  else if (m.sel.size === 0 || (m.valores.length && m.sel.size === m.valores.length)) t = "Todos";
  else if (m.sel.size === 1) t = Array.from(m.sel)[0];
  else t = m.sel.size + " seleccionados";
  Array.prototype.forEach.call(m.lista.querySelectorAll("input"), function(chk, i){
    chk.checked = m.sel.has(m.valores[i]);
  });
  m.etq.textContent = t;
  m.etq.title = m.sel.size && !m.sel.has("\u0000") ? Array.from(m.sel).join(", ") : t;
}

// al mover director se recalcula la lista de líderes, y así hacia abajo
function cascada(campo){
  if (campo === "director") llenarMulti("lider");
}

function visiblePara(campo, f){
  if (campo === "lider") return cumple("director", f);
  return true;
}

function cumple(campo, f){
  const m = MULTI[campo];
  if (!m || m.sel.size === 0) return true;
  if (m.sel.has("\u0000")) return false;
  return m.sel.has(f[campo]);
}

function cerrarMultis(){
  Object.keys(MULTI).forEach(function(k){
    const m = MULTI[k];
    if (m.panel){ m.panel.classList.add("oculto"); m.btn.classList.remove("activo"); }
  });
}

function seleccionTexto(campo){
  const m = MULTI[campo];
  if (!m || m.sel.size === 0) return "";
  if (m.sel.has("\u0000")) return "ninguno";
  if (m.valores.length && m.sel.size === m.valores.length) return "todos";
  return Array.from(m.sel).join(" + ");
}

/* ---------- reglas de conteo ---------- */

function importeDe(f){
  const modo = el("importeArpu").value;
  if (modo === "pp") return f.pp;
  if (modo === "pl") return f.pl;
  if (modo === "pladd") return f.pl + f.addon;
  return f.pp + f.addon;   // pronto pago + adicionales
}

function esValidada(f){
  const regla = el("reglaVal").value;
  const conFecha = !!f.fVal;
  const conEstatus = /valid/i.test(f.estatus);
  if (regla === "estatus") return conEstatus;
  if (regla === "ambos") return conFecha && conEstatus;
  return conFecha;
}
function esInstalada(f){
  if (!f.fIns) return false;
  if (el("reglaIns").value === "completado") return /complet/i.test(f.estatus2);
  return true;
}

function pasaFiltros(f){
  return cumple("director", f) && cumple("lider", f) && cumple("canal", f) && cumple("plan", f);
}

/* ---------- histórico por semana cerrada ---------- */

function mesesElegidos(){
  const m = MULTI.mes;
  if (m.sel.has("\u0000")) return [];
  if (!m.sel.size) return MESES.map(function(x){ return x.clave; });
  return MESES.filter(function(x){ return m.sel.has(x.etq); }).map(function(x){ return x.clave; });
}

function semanasCerradas(){
  const meses = mesesElegidos();
  if (!meses.length || !FECHA_MAX) return [];
  const lista = SEMANAS.filter(function(k){
    const l = lunesDe(k);
    const dom = new Date(l.getFullYear(), l.getMonth(), l.getDate() + 6);
    if (dom > FECHA_MAX) return false;                       // semana aún abierta
    for (let i = 0; i < 7; i++){
      const d = new Date(l.getFullYear(), l.getMonth(), l.getDate() + i);
      const mk = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
      if (meses.indexOf(mk) >= 0) return true;
    }
    return false;
  });
  return lista.slice(-26);
}

function claveMes(d){ return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); }

function agregaSemanas(claves, fn){
  const set = {};
  claves.forEach(function(k, i){ set[k] = i; });
  const acc = {};
  function bolsa(g, tipo){
    if (!acc[g]) acc[g] = { op:{}, val:{}, ins:{}, imp:{} };
    return acc[g][tipo];
  }
  for (const f of FILAS){
    if (!pasaFiltros(f)) continue;
    if (f.fOp){ const k = fn(f.fOp); if (k in set){ const b = bolsa(grupoDe(f, f.fOp),"op"); b[k] = (b[k]||0)+1; } }
    if (esValidada(f) && f.fVal){ const k = fn(f.fVal); if (k in set){ const b = bolsa(grupoDe(f, f.fVal),"val"); b[k] = (b[k]||0)+1; } }
    if (esInstalada(f)){
      const k = fn(f.fIns);
      if (k in set){
        const g = grupoDe(f, f.fIns);
        const b = bolsa(g,"ins"); b[k] = (b[k]||0)+1;
        const bi = bolsa(g,"imp"); bi[k] = (bi[k]||0) + importeDe(f);
      }
    }
  }
  return acc;
}

function tablasPeriodo(claves, etiquetas, acc, sufijo){
  const grupos = ordenaGrupos(Object.keys(acc), function(g){
    return claves.reduce(function(s,k){ return s + ((acc[g].ins[k]||0) + (acc[g].op[k]||0)); }, 0);
  });

  function totalTipo(g, tipo){ return claves.reduce(function(s,k){ return s + (acc[g][tipo][k] || 0); }, 0); }
  function sumaCol(tipo, k){ return grupos.reduce(function(s,g){ return s + (acc[g][tipo][k] || 0); }, 0); }

  const enc = '<thead><tr><th>' + tituloGrupo() + "</th>" +
    etiquetas.map(function(e){ return "<th>" + e + "</th>"; }).join("") +
    '<th class="tot">Total</th></tr></thead>';

  let html = "";

  BLOQUES.forEach(function(b){
    let filas = "";
    grupos.forEach(function(g){
      filas += "<tr><td>" + g + "</td>" +
        claves.map(function(k){ return celdaNum(acc[g][b.tipo][k] || 0); }).join("") +
        celdaNum(totalTipo(g, b.tipo), "tot") + "</tr>";
    });
    filas += '<tr class="total"><td>Total</td>' +
      claves.map(function(k){ return celdaNum(sumaCol(b.tipo, k)); }).join("") +
      celdaNum(claves.reduce(function(s,k){ return s + sumaCol(b.tipo, k); }, 0), "tot") + "</tr>";
    html += '<section class="panel"><h2>' + b.titulo.toUpperCase() + " " + sufijo +
      ' <span class="sub">' + b.nota + "</span></h2>" +
      '<div class="scroll"><table class="compacta">' + enc + "<tbody>" + filas + "</tbody></table></div></section>";
  });

  [["val","op","validadas sobre oportunidad"], ["ins","val","instalaciones sobre validadas"]].forEach(function(par){
    const arriba = par[0], abajo = par[1];
    let filas = "";
    grupos.forEach(function(g){
      filas += "<tr><td>" + g + "</td>" +
        claves.map(function(k){
          const d = acc[g][abajo][k] || 0;
          return "<td>" + (d ? Math.round((acc[g][arriba][k] || 0) / d * 100) + "%" : "\u2014") + "</td>";
        }).join("") +
        '<td class="tot">' + (totalTipo(g, abajo) ? Math.round(totalTipo(g, arriba) / totalTipo(g, abajo) * 100) + "%" : "\u2014") + "</td></tr>";
    });
    let tA = 0, tB = 0;
    filas += '<tr class="total"><td>Total</td>' +
      claves.map(function(k){
        const a = sumaCol(arriba, k), b2 = sumaCol(abajo, k);
        tA += a; tB += b2;
        return "<td>" + (b2 ? Math.round(a / b2 * 100) + "%" : "\u2014") + "</td>";
      }).join("") +
      '<td class="tot">' + (tB ? Math.round(tA / tB * 100) + "%" : "\u2014") + "</td></tr>";
    html += '<section class="panel"><h2>CONVERSI\u00d3N ' + sufijo + " \u00b7 " + par[2].toUpperCase() + "</h2>" +
      '<div class="scroll"><table class="compacta">' + enc + "<tbody>" + filas + "</tbody></table></div></section>";
  });

  // ARPU de lo instalado
  let filasArpu = "";
  function arpu(imp, n){ return n ? "$" + Math.round(imp / n).toLocaleString("es-MX") : "\u2014"; }
  grupos.forEach(function(g){
    filasArpu += "<tr><td>" + g + "</td>" +
      claves.map(function(k){ return "<td>" + arpu(acc[g].imp[k] || 0, acc[g].ins[k] || 0) + "</td>"; }).join("") +
      '<td class="tot">' + arpu(totalTipo(g, "imp"), totalTipo(g, "ins")) + "</td></tr>";
  });
  let impT = 0, insT = 0;
  filasArpu += '<tr class="total"><td>Total</td>' +
    claves.map(function(k){
      const im = sumaCol("imp", k), ins = sumaCol("ins", k);
      impT += im; insT += ins;
      return "<td>" + arpu(im, ins) + "</td>";
    }).join("") +
    '<td class="tot">' + arpu(impT, insT) + "</td></tr>";
  html += '<section class="panel"><h2>ARPU ' + sufijo +
    ' <span class="sub">promedio de lo instalado \u00b7 ' + el("importeArpu").options[el("importeArpu").selectedIndex].text.toLowerCase() + '</span></h2>' +
    '<div class="scroll"><table class="compacta">' + enc + "<tbody>" + filasArpu + "</tbody></table></div></section>";

  return html;
}

function etqMes(k){ return NOMBRE_MES[Number(k.slice(5)) - 1].slice(0, 3) + " " + k.slice(2, 4); }

function historicoHtml(){

  if (!claves.length){

/* ---------- planes: velocidad, TV y adicional ---------- */

const NOMBRES_VEL = [
  [/RELAMPAGO/, 1200], [/SONICO/, 500], [/VELOZ/, 250], [/TURBO/, 350],
  [/ELEMENTAL/, 150], [/ESENCIAL/, 250], [/DINAMICO/, 350], [/EMPRENDEDOR/, 500],
  [/EXPERTO/, 1000], [/EJECUTIVO/, 5000], [/ELITE/, 10000]
];

function velocidadDe(plan){
  const n = normaliza(plan);
  let m = /(\d+(?:\.\d+)?)\s*GB/.exec(n);
  if (m) return Math.round(Number(m[1]) * 1000);
  m = /(\d{2,5})\s*(?:MEGAS|MEGA|MB)/.exec(n);
  if (m) return Number(m[1]);
  m = /MICRO\s*(\d{2,5})/.exec(n);
  if (m) return Number(m[1]);
  for (let i = 0; i < NOMBRES_VEL.length; i++){
    if (NOMBRES_VEL[i][0].test(n)) return NOMBRES_VEL[i][1];
  }
  return null;
}

function llevaTv(plan){
  return /(^|[\s\-])TV([\s\-]|$)/.test(normaliza(plan));
}

function etiquetaVel(v){
  return v === null ? "Sin velocidad" : v.toLocaleString("es-MX") + " megas";
}

function velCorta(v){ return v === null ? "Otros" : v.toLocaleString("es-MX"); }

function planCorto(plan){
  return String(plan || "SIN PLAN")
    .replace(/\s*[vV]\s*\d+\s*$/, "")
    .replace(/\bMEGAS?\b/ig, "")
    .replace(/\s{2,}/g, " ").trim();
}

function tieneAdicional(plan){
  const n = normaliza(plan);
  return listaAjuste("palabrasAdicional").some(function(w){ return w && n.indexOf(w) >= 0; });
}

function planClave(f){
  const vista = el("planVista").value;
  const vel = velocidadDe(f.plan);
  const ordenVel = vel === null ? 1e9 : vel;
  const conTv = llevaTv(f.plan);
  const conAd = tieneAdicional(f.plan);
  const tv = conTv ? "Con TV" : "Sin TV";
  const ad = conAd ? "Con adicional" : "Sin adicional";

  if (vista === "plan")  return { orden:[0, 0, f.plan], etq: f.plan || "SIN PLAN", corto: planCorto(f.plan) };
  if (vista === "tv")    return { orden:[conTv ? 0 : 1, 0, ""], etq: tv, corto: conTv ? "TV" : "Sin TV" };
  if (vista === "vel")   return { orden:[0, ordenVel, ""], etq: etiquetaVel(vel), corto: velCorta(vel) };
  if (vista === "ad")    return { orden:[conAd ? 0 : 1, 0, ""], etq: ad, corto: conAd ? "Adicional" : "Sin adicional" };
  if (vista === "velad") return { orden:[conAd ? 0 : 1, ordenVel, ""], etq: ad + " \u00b7 " + etiquetaVel(vel),
                                  corto: velCorta(vel) + (conAd ? " Ad" : ""), grupo: ad };
  return { orden:[conTv ? 0 : 1, ordenVel, ""], etq: tv + " \u00b7 " + etiquetaVel(vel),
           corto: velCorta(vel) + (conTv ? " TV" : ""), grupo: tv };
}

function planesPeriodoHtml(claves, etqs, fn, rotulo){
  if (!claves.length){
    return '<section class="panel"><h2>Instalaciones por plan</h2>' +
           '<div class="aviso">Elige al menos un mes en \u201cMeses del hist\u00f3rico\u201d.</div></section>';
  }
  const set = {};
  claves.forEach(function(k){ set[k] = true; });

  const filas = {};      // idPlan -> {meta, per:{}}
  const totCol = {};
  let granTotal = 0;

  for (const f of FILAS){
    if (!pasaFiltros(f) || !esInstalada(f)) continue;
    const k = fn(f.fIns);
    if (!(k in set)) continue;
    const pc = planClave(f);
    const id = pc.orden.join("|") + "|" + pc.etq;
    if (!filas[id]) filas[id] = { meta:pc, per:{} };
    filas[id].per[k] = (filas[id].per[k] || 0) + 1;
    totCol[k] = (totCol[k] || 0) + 1;
    granTotal++;
  }

  const ids = Object.keys(filas).sort(function(a, b){
    const A = filas[a].meta.orden, B = filas[b].meta.orden;
    if (A[0] !== B[0]) return A[0] - B[0];
    if (A[1] !== B[1]) return A[1] - B[1];
    return String(A[2]).localeCompare(String(B[2]), "es");
  });

  if (!ids.length){
    return '<section class="panel"><h2>Instalaciones por plan</h2>' +
           '<div class="aviso">No hay instalaciones en el periodo seleccionado.</div></section>';
  }

  function celda(n, base, clase){
    if (!n) return '<td class="' + (clase || "") + ' cero">0</td>';
    return "<td" + (clase ? ' class="' + clase + '"' : "") + ">" + num(n) +
           '<span class="mini">' + (base ? Math.round(n / base * 100) + "%" : "\u2014") + "</span></td>";
  }

  let cuerpo = "", grupoActual = null, sub = null;
  function cerrarSub(){
    if (!sub) return "";
    const r = '<tr class="total"><td>Subtotal ' + grupoActual + "</td>" +
      claves.map(function(k){ return celda(sub.per[k] || 0, totCol[k]); }).join("") +
      celda(sub.tot, granTotal, "tot") + "</tr>";
    sub = null;
    return r;
  }

  ids.forEach(function(id){
    const meta = filas[id].meta, per = filas[id].per;
    if (meta.grupo && meta.grupo !== grupoActual){
      cuerpo += cerrarSub();
      grupoActual = meta.grupo;
      sub = { per:{}, tot:0 };
    }
    let total = 0;
    claves.forEach(function(k){
      const n = per[k] || 0;
      total += n;
      if (sub){ sub.per[k] = (sub.per[k] || 0) + n; }
    });
    if (sub) sub.tot += total;
    cuerpo += "<tr><td>" + meta.etq + "</td>" +
      claves.map(function(k){ return celda(per[k] || 0, totCol[k]); }).join("") +
      celda(total, granTotal, "tot") + "</tr>";
  });
  cuerpo += cerrarSub();
  cuerpo += '<tr class="total"><td>Total</td>' +
    claves.map(function(k){ return celda(totCol[k] || 0, totCol[k] || 0); }).join("") +
    celda(granTotal, granTotal, "tot") + "</tr>";

  return '<section class="panel"><h2>Instalaciones por plan ' + rotulo +
    ' <span class="sub">el porcentaje es la participaci\u00f3n del plan dentro de cada ' +
    (rotulo === "por mes" ? "mes" : "semana") + '</span></h2>' +
    '<div class="scroll"><table class="compacta"><thead><tr><th>Plan</th>' +
    etqs.map(function(e){ return "<th>" + e + "</th>"; }).join("") +
    '<th class="tot">Total</th></tr></thead><tbody>' + cuerpo + "</tbody></table></div></section>";
}

function matrizHtml(sem, fn, etqPeriodo){
  fn = fn || isoSemana;
  etqPeriodo = etqPeriodo || ("semana " + etiquetaSemana(sem));
  const metrica = el("matrizMetrica").value;
  const nombre = el("matrizMetrica").options[el("matrizMetrica").selectedIndex].text;

  const totCol = {};
  const totFila = {};
  let granTotal = 0;

  for (const f of FILAS){
    if (!pasaFiltros(f)) continue;
    let cuenta = false, fecha = null;
    if (metrica === "ins"){ cuenta = esInstalada(f) && fn(f.fIns) === sem; fecha = f.fIns; }
    else if (metrica === "val"){ cuenta = esValidada(f) && f.fVal && fn(f.fVal) === sem; fecha = f.fVal; }
    else { cuenta = !!f.fOp && fn(f.fOp) === sem; fecha = f.fOp; }
    if (!cuenta) continue;

    const k = planClave(f);
    const idp = k.orden.join("|") + "|" + k.etq;
    cols[idp] = k;
    const g = grupoDe(f, fecha);

    celdas[g][idp] = (celdas[g][idp] || 0) + 1;
    totCol[idp] = (totCol[idp] || 0) + 1;
    totFila[g] = (totFila[g] || 0) + 1;
    granTotal++;
  }

  const ids = Object.keys(cols).sort(function(a, b){
    const A = cols[a].orden, B = cols[b].orden;
    if (A[0] !== B[0]) return A[0] - B[0];
    if (A[1] !== B[1]) return A[1] - B[1];
    return String(A[2]).localeCompare(String(B[2]), "es");
  });
  const grupos = ordenaGrupos(Object.keys(celdas), function(g){ return totFila[g]; });

  if (!ids.length){
    return '<section class="panel"><h2>' + nombre + ' por plan</h2><div class="aviso">No hay movimientos en el periodo seleccionado.</div></section>';
  }

  function celda(n, base, clase){

    return "<td" + (clase ? ' class="' + clase + '"' : "") + ">" + num(n) +
           '<span class="mini">' + (base ? Math.round(n / base * 100) + "%" : "\u2014") + "</span></td>";
  }

  let filas = "";
  grupos.forEach(function(g){
    filas += "<tr><td>" + g + "</td>" +
      ids.map(function(id){ return celda(celdas[g][id] || 0, totFila[g]); }).join("") +
      '<td class="tot">' + num(totFila[g]) + "</td></tr>";
  });
  filas += '<tr class="total"><td>Total</td>' +
    ids.map(function(id){ return celda(totCol[id], granTotal); }).join("") +
    celda(granTotal, granTotal, "tot") + "</tr>";

  return '<section class="panel"><h2>' + nombre + " por plan \u00b7 " + tituloGrupo().toLowerCase() +
    ' <span class="sub">' + etqPeriodo + " \u00b7 el porcentaje es la mezcla de cada uno: cada rengl\u00f3n suma 100%</span></h2>" +
    '<div class="scroll"><table class="compacta"><thead><tr><th>' + tituloGrupo() + "</th>" +
    ids.map(function(id){ return "<th>" + (cols[id].corto || cols[id].etq) + "</th>"; }).join("") +
    '<th class="tot">Total</th></tr></thead><tbody>' + filas + "</tbody></table></div></section>";

/* ---------- plantilla, rankings y metas por coach ---------- */

let PLANTILLA = [];      // {numero, nombre, puesto, coach, lider, vacante}
let RANKINGS = new Map();// numero -> {ranking, inst:{clave:n}, fuente}
let RANK_NOMBRE = new Map();// nombre normalizado -> mismo registro
let INFO_EQ = { estado:"sin cargar", plantilla:0, ranking:0, entrena:0, mesRanking:"", mesesInst:[], encabezados:{} };
let CARGANDO_EQ = false;

const ORDEN_METAL = ["Platino","Oro","Plata","Bronce","Condicionado","Entrenamiento","Vacante","Sin ranking"];

function metasMetal(){
  const m = {};
  el("metasRanking").value.split(";").forEach(function(par){
    const p = par.split(":");
    if (p.length === 2) m[normaliza(p[0])] = Number(p[1].trim()) || 0;
  });
  return m;
}
function metaDe(metal){
  const m = metasMetal();
  return m[normaliza(metal)] || 0;
}

function letraAIndice(l){
  const t = String(l || "").trim().toUpperCase();
  if (!t) return -1;
  let n = 0;
  for (let i = 0; i < t.length; i++){
    const c = t.charCodeAt(i) - 64;
    if (c < 1 || c > 26) return -1;
    n = n * 26 + c;
  }
  return n - 1;
}
function letrasDe(id){
  return el(id).value.split(";").map(function(x){ return letraAIndice(x); });
}
function indiceLetra(i){
  let n = i + 1, s = "";
  while (n > 0){ const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = Math.floor((n - 1) / 26); }
  return s;
}

function celdasTexto(fila){
  return (fila.c || []).map(function(c){ return c && c.v != null ? String(c.v).trim() : ""; });
}

// busca en los primeros renglones el que trae los encabezados
function filaEncabezado(rows, pistas){
  for (let i = 0; i < Math.min(12, rows.length); i++){
    const t = celdasTexto(rows[i]).map(normaliza);
    let aciertos = 0;
    pistas.forEach(function(p){ if (t.some(function(h){ return h.indexOf(p) >= 0; })) aciertos++; });
    if (aciertos >= 2) return i;
  }
  return 0;
}

function buscaCol(enc, pistas, evitar){
  for (let i = 0; i < enc.length; i++){
    const h = normaliza(enc[i]);
    if (!h) continue;
    if (evitar && evitar.some(function(e){ return h.indexOf(e) >= 0; })) continue;
    if (pistas.some(function(p){ return h.indexOf(p) >= 0; })) return i;
  }
  return -1;
}

const MESES_TXT = ["ENERO","FEBRERO","MARZO","ABRIL","MAYO","JUNIO","JULIO","AGOSTO","SEPTIEMBRE","OCTUBRE","NOVIEMBRE","DICIEMBRE"];

function mesDeTexto(h){
  const n = normaliza(h);
  for (let i = 0; i < 12; i++){
    if (n.indexOf(MESES_TXT[i]) >= 0){
      const a = /(\d{4})/.exec(n);
      return { mes:i, anio: a ? Number(a[1]) : 0, clave: (a ? a[1] : "0000") + "-" + String(i + 1).padStart(2, "0") };
    }
  }
  return null;
}

async function leerRanking(id, gid, fuente){
  const t = await consultaGviz(id, gid, "select *", 90, 0);
  const rows = t.rows || [];
  const iEnc = filaEncabezado(rows, ["HOMOLOGADO", "RANKING", "NOMBRE", "EMPLEADO"]);
  const enc = celdasTexto(rows[iEnc]);
  const letras = letrasDe("colRanking");   // núm; nombre; metal
  let cNum = letras[0] >= 0 ? letras[0] : buscaCol(enc, ["HOMOLOGADO", "NUMERO"]);
  const cNom = letras[1] >= 0 ? letras[1] : buscaCol(enc, ["NOMBRE"]);
  const cMetal = letras[2] >= 0 ? letras[2] : -1;

  // respaldo: si la columna del número viene vacía en los datos, probar la B
  function llenos(col){
    let n = 0;
    for (let r = iEnc + 1; r < Math.min(rows.length, iEnc + 40); r++){
      const v = celdasTexto(rows[r]);
      if (col >= 0 && v[col]) n++;
    }
    return n;
  }
  if (llenos(cNum) === 0 && llenos(1) > 0) cNum = 1;

  // la fila de arriba trae el mes combinado sobre cada bloque; se arrastra hacia la derecha
  const arriba = iEnc > 0 ? celdasTexto(rows[iEnc - 1]) : [];
  const mesCol = [];
  let ultimo = "";
  for (let i = 0; i < Math.max(enc.length, arriba.length); i++){
    if (arriba[i]) ultimo = arriba[i];
    mesCol[i] = ultimo;
  }

  const colsRank = [], colsInst = [];
  enc.forEach(function(h, i){
    const n = normaliza(h);
    const m = mesDeTexto(h) || mesDeTexto(mesCol[i] || "");
    if (!m) return;
    if (n.indexOf("RANKING") >= 0 || n.indexOf("META") >= 0 || n.indexOf("NIVEL") >= 0) colsRank.push({ i:i, mes:m });
    else if (n.indexOf("INSTALACION") >= 0) colsInst.push({ i:i, mes:m });
  });
  colsRank.sort(function(a,b){ return a.mes.clave < b.mes.clave ? -1 : 1; });
  colsInst.sort(function(a,b){ return a.mes.clave < b.mes.clave ? -1 : 1; });

  let n = 0;
  for (let r = iEnc + 1; r < rows.length; r++){
    const v = celdasTexto(rows[r]);
    const num = cNum >= 0 ? clave(v[cNum]) : "";
    if (!num) continue;
    const inst = {};
    colsInst.forEach(function(c){
      const x = Number(String(v[c.i]).replace(/[^0-9.\-]/g, ""));
      inst[c.mes.clave] = isFinite(x) ? x : 0;
    });
    let rk = "";
    if (cMetal >= 0) rk = (v[cMetal] || "").trim();
    if (!rk){
      for (let k = colsRank.length - 1; k >= 0; k--){
        const val = (v[colsRank[k].i] || "").trim();
        if (val && val !== "-"){ rk = val; break; }
      }
    }
    const reg = {
      ranking: rk,
      nombre: cNom >= 0 ? v[cNom] : "",
      inst: inst,
      fuente: fuente
    };
    RANKINGS.set(num, reg);
    if (reg.nombre) RANK_NOMBRE.set(normaliza(reg.nombre), reg);
    n++;
  }
  return {
    n: n,
    mesRanking: colsRank.length ? colsRank[colsRank.length - 1].mes.clave : "",
    mesesInst: colsInst.map(function(c){ return c.mes.clave; }),
    enc: enc,
    arriba: mesCol,
    cNum: cNum, cNom: cNom,
    muestra: rows[iEnc + 1] ? celdasTexto(rows[iEnc + 1]) : []
  };
}

async function cargarEquipos(){
  if (CARGANDO_EQ) return;
  CARGANDO_EQ = true;
  const id = el("hojaId").value.trim();
  PLANTILLA = [];
  RANKINGS = new Map();
  RANK_NOMBRE = new Map();
  INFO_EQ = { estado:"cargando", plantilla:0, ranking:0, entrena:0, mesRanking:"", mesesInst:[], encabezados:{} };
  try{
    // RANKING primero; ENTRENAMIENTO manda si la persona aparece ahí
    const r1 = await leerRanking(id, el("gidRanking").value.trim(), "ranking");
    INFO_EQ.ranking = r1.n;
    INFO_EQ.mesRanking = r1.mesRanking;
    INFO_EQ.mesesInst = r1.mesesInst;
    INFO_EQ.encabezados.ranking = r1.enc;
    INFO_EQ.muestraRanking = r1.muestra;
    INFO_EQ.arribaRanking = r1.arriba;

    if (el("gidEntrena").value.trim()){
      const r2 = await leerRanking(id, el("gidEntrena").value.trim(), "entrenamiento");
      INFO_EQ.entrena = r2.n;
      INFO_EQ.encabezados.entrenamiento = r2.enc;
      INFO_EQ.muestraEntrena = r2.muestra;
      INFO_EQ.arribaEntrena = r2.arriba;
      if (!INFO_EQ.mesesInst.length) INFO_EQ.mesesInst = r2.mesesInst;
    }

    const t = await consultaGviz(id, el("gidPlantilla").value.trim(), "select *", 90, 0);
    const rows = t.rows || [];
    const iEnc = filaEncabezado(rows, ["COACH", "LIDER", "PUESTO", "NOMBRE", "EMPLEADO", "POSICION"]);
    const enc = celdasTexto(rows[iEnc]);
    INFO_EQ.encabezados.plantilla = enc;
    INFO_EQ.muestraPlantilla = rows[iEnc + 1] ? celdasTexto(rows[iEnc + 1]) : [];
    const lp = letrasDe("colPlantilla");   // núm; coach; nombre
    let cNum = lp[0] >= 0 ? lp[0] : buscaCol(enc, ["HOMOLOGADO", "NUMERO"]);
    const cCoa = lp[1] >= 0 ? lp[1] : buscaCol(enc, ["COACH"]);
    const cNom = lp[2] >= 0 ? lp[2] : buscaCol(enc, ["NOMBRE"], ["COACH", "LIDER", "JEFE"]);
    const cPue = buscaCol(enc, ["PUESTO", "POSICION"]);

    function llenosP(col){
      let n = 0;
      for (let r = iEnc + 1; r < Math.min(rows.length, iEnc + 40); r++){
        const v = celdasTexto(rows[r]);
        if (col >= 0 && v[col]) n++;
      }
      return n;
    }
    if (llenosP(cNum) === 0 && llenosP(1) > 0) cNum = 1;
    INFO_EQ.colsPlantilla = { num:indiceLetra(cNum), coach:indiceLetra(cCoa), nombre:indiceLetra(cNom) };

    const crudos = [];
    for (let r = iEnc + 1; r < rows.length; r++){
      const v = celdasTexto(rows[r]);
      const nombre = cNom >= 0 ? v[cNom] : "";
      const jefe = cCoa >= 0 ? v[cCoa] : "";
      if (!nombre && !jefe) continue;
      crudos.push({
        numero: cNum >= 0 ? clave(v[cNum]) : "",
        nombre: nombre,
        puesto: cPue >= 0 ? v[cPue] : "",
        jefe: jefe,
        vacante: /VACANTE/i.test(normaliza(nombre)) || /VACANTE/i.test(normaliza(v[cPue] || ""))
      });
    }

    // el jefe de cada quien es su coach; el jefe del coach es el líder
    const porNombre = {};
    crudos.forEach(function(p){ if (p.nombre) porNombre[normaliza(p.nombre)] = p; });
    function jefeDe(nom){
      const p = porNombre[normaliza(nom)];
      return p && p.jefe ? p.jefe : "";
    }

    const jefes = new Set();
    crudos.forEach(function(p){ if (p.jefe) jefes.add(normaliza(p.jefe)); });

    crudos.forEach(function(p){
      // de venta = quien no es jefe de nadie (así quedan fuera coaches y líderes)
      if (jefes.has(normaliza(p.nombre))) return;
      if (!p.jefe) return;
      const coach = p.jefe || "SIN COACH";
      const lider = jefeDe(coach) || "SIN LÍDER";
      PLANTILLA.push({
        numero: p.numero, nombre: p.nombre, puesto: p.puesto,
        coach: coach, lider: lider, vacante: p.vacante
      });
    });
    INFO_EQ.plantilla = PLANTILLA.length;
    INFO_EQ.estado = PLANTILLA.length ? "ok" : "plantilla vacía";
  }catch(e){
    INFO_EQ.estado = "falló: " + e.message;
  }
  CARGANDO_EQ = false;
  pintar();
}

// los 3 meses cerrados se toman del histórico de RANKING, quitando el mes en curso
function mesesCerradosAtras(n){
  const hoy = new Date();
  const enCurso = hoy.getFullYear() + "-" + String(hoy.getMonth() + 1).padStart(2, "0");
  const hay = (INFO_EQ.mesesInst || []).filter(function(k){ return k < enCurso; });
  if (hay.length) return hay.slice(-n);
  // respaldo: contar hacia atrás desde el mes en curso
  const salida = [];
  for (let i = 1; i <= n; i++){
    const d = new Date(hoy.getFullYear(), hoy.getMonth() - i, 1);
    salida.push(d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"));
  }
  return salida.reverse();
}

function promedioInst(r){
  if (!r || !r.inst) return 0;
  const meses = mesesCerradosAtras(3);
  if (!meses.length) return 0;
  let suma = 0;
  meses.forEach(function(k){ suma += (r.inst[k] || 0); });
  return suma / meses.length;
}

function registroDe(p){
  return RANKINGS.get(p.numero) || RANK_NOMBRE.get(normaliza(p.nombre)) || null;
}

function metalDe(p){
  if (p.vacante) return "Vacante";
  const r = registroDe(p);
  if (!r || !r.ranking) return "Sin ranking";
  const n = normaliza(r.ranking);
  let metal = "Sin ranking";
  if (n.indexOf("ORO") >= 0) metal = "Oro";
  else if (n.indexOf("PLATA") >= 0) metal = "Plata";
  else if (n.indexOf("BRONCE") >= 0) metal = "Bronce";
  else if (n.indexOf("CONDICION") >= 0) metal = "Condicionado";
  else if (n.indexOf("ENTRENAMIENTO") >= 0) metal = "Entrenamiento";
  else if (n.indexOf("PLATINO") >= 0) metal = "Platino";

  if (metal === "Oro" && promedioInst(r) >= Number(el("umbralPlatino").value || 20)) metal = "Platino";
  return metal;
}

      INFO_EQ.estado + '). Revisa los gid en Ajustes de la fuente.</div></section>';
  }

  const semMes = Number(el("semanasMes").value) || 4.33;
  const filtroLider = MULTI.lider && MULTI.lider.sel.size && !MULTI.lider.sel.has("\u0000")
    ? MULTI.lider.sel : null;

  const lideres = {};
  PLANTILLA.forEach(function(p){
    if (filtroLider && !filtroLider.has(p.lider)) return;

    c.gente.push(p.nombre + " · " + metal);
  });

    return '<section class="panel"><h2>Equipos por coach</h2><div class="aviso">La plantilla no trajo renglones con ese filtro de líder.</div></section>';
  }

  function metaSemanal(c){
    return ORDEN_METAL.reduce(function(s, m){ return s + (c[m] || 0) * metaDe(m); }, 0);
  }

  const enc = "<thead><tr><th>Coach</th>" +
    ORDEN_METAL.map(function(m){ return "<th>" + m + "</th>"; }).join("") +
    '<th class="tot">Personas</th><th>Meta semanal</th><th>Meta mensual</th></tr></thead>';

  const resumen = {};

  nombres.forEach(function(L){

      tot.total += c.total;
      const ms = metaSemanal(c);
      filas += "<tr><td>" + co + '<span class="mini">' + (c.gente || []).join(" \u00b7 ") + "</span></td>" +
        ORDEN_METAL.map(function(m){ return celdaNum(c[m] || 0); }).join("") +

    });
    const msT = metaSemanal(tot);
    filas += '<tr class="total"><td>Total del líder</td>' +
      ORDEN_METAL.map(function(m){ return celdaNum(tot[m] || 0); }).join("") +
      celdaNum(tot.total, "tot") + celdaNum(msT) + celdaNum(Math.round(msT * semMes)) + "</tr>";
    resumen[L] = { tot:tot, ms:msT, coaches:coaches.length };

    html += '<section class="panel"><h2>' + L + ' <span class="sub">' + coaches.length +
      " coach(es) \u00b7 " + tot.total + " personas</span></h2>" +
      '<div class="scroll"><table class="compacta">' + enc + "<tbody>" + filas + "</tbody></table></div></section>";
  });

  // resumen general
  let filasR = "";
  const gran = { total:0 };
  nombres.forEach(function(L){
    const t = resumen[L].tot;
    ORDEN_METAL.forEach(function(m){ gran[m] = (gran[m] || 0) + (t[m] || 0); });
    gran.total += t.total;
    filasR += "<tr><td>" + L + "</td>" +
      ORDEN_METAL.map(function(m){ return celdaNum(t[m] || 0); }).join("") +
      celdaNum(t.total, "tot") + celdaNum(resumen[L].ms) + celdaNum(Math.round(resumen[L].ms * semMes)) + "</tr>";
  });
  const msG = ORDEN_METAL.reduce(function(s, m){ return s + (gran[m] || 0) * metaDe(m); }, 0);
  filasR += '<tr class="total"><td>Total</td>' +
    ORDEN_METAL.map(function(m){ return celdaNum(gran[m] || 0); }).join("") +
    celdaNum(gran.total, "tot") + celdaNum(msG) + celdaNum(Math.round(msG * semMes)) + "</tr>";

  const cab = '<section class="panel"><h2>Resumen por líder <span class="sub">meta semanal por metal: ' +
    el("metasRanking").value + " \u00b7 mensual = semanal \u00d7 " + semMes + "</span></h2>" +
    '<div class="scroll"><table class="compacta">' + enc.replace(">Coach<", ">Líder<") +
    "<tbody>" + filasR + "</tbody></table></div></section>";

  return cab + html;
}

function revisarEquipos(){
  const caja = el("revision");
  caja.classList.remove("oculto");
  const meses = mesesCerradosAtras(3);

  function mapa(titulo, enc, muestra, arriba){
    if (!enc || !enc.length) return "<b>" + titulo + "</b>: sin encabezados<br>";
    let t = "<b>" + titulo + "</b> (" + enc.length + " columnas)<br>";
    const partes = [];
    for (let i = 0; i < enc.length; i++){
      const h = (enc[i] || "").trim();
      const d = muestra && muestra[i] ? String(muestra[i]).slice(0, 22) : "";
      if (!h && !d) continue;
      const mes = arriba && arriba[i] ? " [" + arriba[i] + "]" : "";
      partes.push("<b>" + indiceLetra(i) + "</b> " + (h || "(sin t\u00edtulo)") + mes + (d ? " \u2192 " + d : ""));
    }
    return t + partes.join("<br>") + "<br><br>";
  }

  let oros = 0, platinos = 0, porNum = 0, porNom = 0, sinCruce = 0;
  PLANTILLA.forEach(function(p){
    if (RANKINGS.get(p.numero)) porNum++;
    else if (RANK_NOMBRE.get(normaliza(p.nombre))) porNom++;
    else sinCruce++;
  });
  const promedios = [];
  PLANTILLA.forEach(function(p){
    const m = metalDe(p);
    if (m === "Oro") oros++;
    if (m === "Platino") platinos++;
    const r = registroDe(p);
    if (r) promedios.push({ n:p.nombre, m:m, hoja:r.ranking || "vacío", prom: Math.round(promedioInst(r) * 10) / 10 });
  });
  promedios.sort(function(a, b){ return b.prom - a.prom; });
  const top = promedios.slice(0, 8).map(function(x){
    return x.n + " \u00b7 hoja: " + x.hoja + " \u00b7 prom 3 meses: " + x.prom + " \u2192 " + x.m;
  });

  const ej = [];
  let i = 0;
  for (const p of PLANTILLA){
    if (i++ >= 6) break;
    const r = registroDe(p);
    ej.push(p.nombre + " (" + (p.numero || "sin n\u00famero") + ") \u00b7 coach: " + p.coach + " \u00b7 l\u00edder: " + p.lider +
      " \u2192 " + metalDe(p) + (r ? " (hoja: " + (r.ranking || "vac\u00edo") + ")" : " (no cruz\u00f3 con rankings)"));
  }

  caja.innerHTML =
    "<b>Plantilla</b>: " + INFO_EQ.plantilla + " personas de venta \u00b7 <b>RANKING</b>: " + INFO_EQ.ranking +
    " \u00b7 <b>ENTRENAMIENTO</b>: " + INFO_EQ.entrena + " \u00b7 estado: " + INFO_EQ.estado +
    "<br>Columnas que est\u00e1 usando de plantilla: n\u00famero <b>" + (INFO_EQ.colsPlantilla ? INFO_EQ.colsPlantilla.num : "?") +
    "</b>, coach <b>" + (INFO_EQ.colsPlantilla ? INFO_EQ.colsPlantilla.coach : "?") +
    "</b>, nombre <b>" + (INFO_EQ.colsPlantilla ? INFO_EQ.colsPlantilla.nombre : "?") + "</b>" +
    "<br>Columna de ranking detectada: <b>" + (INFO_EQ.mesRanking || "ninguna") +
    "</b> \u00b7 meses de instalaciones: " + (INFO_EQ.mesesInst.join(", ") || "ninguno") +
    "<br>Meses que se promedian para Platino: <b>" + (meses.join(", ") || "ninguno") +
    "</b> \u00b7 umbral: " + el("umbralPlatino").value +
    "<br>Cruce con rankings: <b>" + porNum + "</b> por n\u00famero, <b>" + porNom + "</b> por nombre, <b>" + sinCruce + "</b> sin cruce" +
    "<br>Resultado: <b>" + platinos + "</b> platinos y <b>" + oros + "</b> oros" +
    "<br><br><b>Mayores promedios</b><br>" + (top.join("<br>") || "sin datos") + "<br><br>" +
    mapa("PLANTILLA", INFO_EQ.encabezados.plantilla, INFO_EQ.muestraPlantilla) +
    mapa("RANKING", INFO_EQ.encabezados.ranking, INFO_EQ.muestraRanking, INFO_EQ.arribaRanking) +
    mapa("RANKING ENTRENAMIENTO", INFO_EQ.encabezados.entrenamiento, INFO_EQ.muestraEntrena, INFO_EQ.arribaEntrena) +

/* ---------- pintado ---------- */

function grupoDe(f, fecha){
  const campo = el("agrupar").value;
  if (campo === "diames") return fecha ? String(fecha.getDate()) : "-";
  return f[campo] || "SIN ASIGNAR";
}

function ordenaGrupos(lista, peso){
  if (el("agrupar").value === "diames"){
    return lista.slice().sort(function(a, b){ return Number(a) - Number(b); });
  }
  return lista.slice().sort(function(a, b){
    const d = peso(b) - peso(a);
    return d !== 0 ? d : a.localeCompare(b, "es");
  });
}

/* ---------- agregación de la semana ---------- */

function vacio(){
  return { op:{d:[0,0,0,0,0,0,0],t:0}, val:{d:[0,0,0,0,0,0,0],t:0}, ins:{d:[0,0,0,0,0,0,0],t:0} };
}

function agregar(claveSem){
  const acc = {};
  function bolsa(g, tipo){
    if (!acc[g]) acc[g] = vacio();
    return acc[g][tipo];
  }
  for (const f of FILAS){
    if (!pasaFiltros(f)) continue;
    if (f.fOp && isoSemana(f.fOp) === claveSem){ const b = bolsa(grupoDe(f, f.fOp), "op"); b.d[diaIndice(f.fOp)]++; b.t++; }
    if (esValidada(f) && f.fVal && isoSemana(f.fVal) === claveSem){ const b = bolsa(grupoDe(f, f.fVal), "val"); b.d[diaIndice(f.fVal)]++; b.t++; }
    if (esInstalada(f) && isoSemana(f.fIns) === claveSem){ const b = bolsa(grupoDe(f, f.fIns), "ins"); b.d[diaIndice(f.fIns)]++; b.t++; }
  }
  return acc;
}

function sumar(acc, tipo){
  const r = { d:[0,0,0,0,0,0,0], t:0 };
  Object.keys(acc).forEach(function(g){
    for (let i = 0; i < 7; i++) r.d[i] += acc[g][tipo].d[i];
    r.t += acc[g][tipo].t;
  });
  return r;
}

const BLOQUES = [
  { tipo:"op",  titulo:"Oportunidad",   nota:"por fecha de creación" },
  { tipo:"val", titulo:"Venta validada", nota:"por fecha de validación" },
  { tipo:"ins", titulo:"Instalaciones",  nota:"por fecha de activación" }

  });

  menu.innerHTML = items.map(function(it){
    return '<button type="button" data-ir="' + it.id + '">' + it.rotulo + "</button>";
  }).join("");
  Array.prototype.forEach.call(menu.querySelectorAll("[data-ir]"), function(b){
    b.addEventListener("click", function(){
      const destino = document.getElementById(b.getAttribute("data-ir"));
      cerrarCajon();
      if (destino && destino.scrollIntoView) destino.scrollIntoView({ behavior:"smooth", block:"start" });
      else if (destino) window.location.hash = destino.id;
    });
  });
  const filtros = ["director","lider","canal","plan","mes"].map(function(c){
    const t = seleccionTexto(c);
    if (!t) return "";
    const nom = c === "lider" ? "líder" : (c === "mes" ? "meses" : c);
    return nom.toUpperCase() + " " + t.toUpperCase();
  }).filter(Boolean).join(" · ");
  const cab = VISTA === "mes"
    ? "Vista mensual · " + (mesesElegidos().length || 0) + " mes(es) seleccionados"
    : "Semana " + etiquetaSemana(sem) + ": " + fCorta(lunes) + " al " + fCorta(domingo) +
      (enCurso ? " · semana abierta, " + diasCorridos + " día(s) con datos" : " · semana cerrada");
  el("rango").textContent = cab + (filtros ? " · " + filtros : "");
}

function claseSemaforo(v, valores){
  if (v === null) return "";
  const ord = valores.filter(function(x){ return x !== null; }).slice().sort(function(a,b){ return b - a; });
  if (ord.length < 2) return "";
  if (v === ord[0]) return " v";
  if (v === ord[ord.length - 1]) return " r";
  return " a";
}

function num(n){ return n ? n.toLocaleString("es-MX") : "0"; }
function celdaNum(n, extra){
  return '<td class="' + (extra||"") + (n ? "" : " cero") + '">' + num(n) + "</td>";
}
function pct(x){ return (x === null || !isFinite(x)) ? "—" : Math.round(x * 100) + "%"; }

function bloqueHtml(b, grupos, act, ant, sem, semAnt, enCurso, diasCorridos){
  const difs = grupos.map(function(g){
    const a = (ant[g] || vacio())[b.tipo].t, c = (act[g] || vacio())[b.tipo].t;
    return a ? (c - a) / a : null;
  });

  let filas = "";
  grupos.forEach(function(g, i){
    const A = (ant[g] || vacio())[b.tipo], C = (act[g] || vacio())[b.tipo];
    const proy = enCurso && diasCorridos > 0 ? Math.round(C.t / diasCorridos * 7) : C.t;
    filas += "<tr><td>" + g + "</td>" + celdaNum(A.t, "sem") +
             C.d.map(function(n, j){ return celdaNum(n, j === 0 ? "sem" : ""); }).join("") +
             celdaNum(C.t, "tot") +
             '<td class="dif' + claseSemaforo(difs[i], difs) + '">' + pct(difs[i]) + "</td>" +
             celdaNum(proy) + "</tr>";
  });

  const TA = sumar(ant, b.tipo), TC = sumar(act, b.tipo);
  const difT = TA.t ? (TC.t - TA.t) / TA.t : null;
  const proyT = enCurso && diasCorridos > 0 ? Math.round(TC.t / diasCorridos * 7) : TC.t;
  filas += '<tr class="total"><td>Total</td>' + celdaNum(TA.t, "sem") +
           TC.d.map(function(n, j){ return celdaNum(n, j === 0 ? "sem" : ""); }).join("") +
           celdaNum(TC.t, "tot") + '<td class="dif">' + pct(difT) + "</td>" + celdaNum(proyT) + "</tr>";

  return '<section class="panel"><h2>' + b.titulo.toUpperCase() +
         ' <span class="sub">' + b.nota + '</span></h2><div class="scroll"><table>' +
         "<thead><tr><th>" + tituloGrupo() + "</th>" +
         '<th class="sem">' + etiquetaSemana(semAnt) + "</th>" +
         DIAS.map(function(d, j){ return "<th" + (j === 0 ? ' class="sem"' : "") + ">" + d + "</th>"; }).join("") +
         '<th class="tot">Total ' + etiquetaSemana(sem) + "</th><th>Dif SA</th><th>Proy</th></tr></thead><tbody>" +
         filas + "</tbody></table></div></section>";
}

function conversionHtml(titulo, arriba, abajo, grupos, act, ant, sem, semAnt){
  function razon(o, tipoA, tipoB){
    const b = o[tipoB].t;
    return b ? o[tipoA].t / b : null;
  }
  let filas = "";
  grupos.forEach(function(g){
    const A = ant[g] || vacio(), C = act[g] || vacio();
    let celdas = "";
    for (let i = 0; i < 7; i++){
      const den = C[abajo].d[i];
      celdas += "<td" + (i === 0 ? ' class="sem"' : "") + ">" + (den ? Math.round(C[arriba].d[i] / den * 100) + "%" : "—") + "</td>";
    }
    filas += "<tr><td>" + g + "</td>" +
             '<td class="sem">' + pct(razon(A, arriba, abajo)) + "</td>" +
             celdas +
             '<td class="tot">' + pct(razon(C, arriba, abajo)) + "</td></tr>";
  });

  const sa = { op: sumar(ant, "op"), val: sumar(ant, "val"), ins: sumar(ant, "ins") };
  const sc = { op: sumar(act, "op"), val: sumar(act, "val"), ins: sumar(act, "ins") };
  let celdasT = "";
  for (let i = 0; i < 7; i++){
    const den = sc[abajo].d[i];
    celdasT += "<td" + (i === 0 ? ' class="sem"' : "") + ">" + (den ? Math.round(sc[arriba].d[i] / den * 100) + "%" : "—") + "</td>";
  }
  filas += '<tr class="total"><td>Total</td><td class="sem">' + pct(sa[abajo].t ? sa[arriba].t / sa[abajo].t : null) + "</td>" +
           celdasT + '<td class="tot">' + pct(sc[abajo].t ? sc[arriba].t / sc[abajo].t : null) + "</td></tr>";

  return '<section class="panel"><h2>' + titulo.toUpperCase() +
         ' <span class="sub">cada día se compara contra el mismo día, por eso puede pasar de 100%</span></h2>' +
         '<div class="scroll"><table class="compacta"><thead><tr><th>' + tituloGrupo() + "</th>" +
         '<th class="sem">' + etiquetaSemana(semAnt) + "</th>" +
         DIAS.map(function(d, j){ return "<th" + (j === 0 ? ' class="sem"' : "") + ">" + d + "</th>"; }).join("") +
         '<th class="tot">' + etiquetaSemana(sem) + "</th></tr></thead><tbody>" + filas + "</tbody></table></div></section>";
}

function tituloGrupo(){
  const s = el("agrupar");
  return s.options[s.selectedIndex].text;
}

/* ---------- salidas ---------- */

function textoResumen(){
  if (!ULTIMO) return "";
  const L = [];
  L.push("SEGUIMIENTO SEMANA " + etiquetaSemana(ULTIMO.sem) + " (vs " + etiquetaSemana(ULTIMO.semAnt) + ")");
  ["director","lider","canal","plan"].forEach(function(c){
    const t = seleccionTexto(c);
    if (t) L.push((c === "lider" ? "Líder" : c === "canal" ? "Canal" : c === "plan" ? "Plan" : "Director") + ": " + t);
  });
  if (ULTIMO.enCurso) L.push("Semana abierta con " + ULTIMO.diasCorridos + " día(s) de información.");
  BLOQUES.forEach(function(b){
    const TA = sumar(ULTIMO.ant, b.tipo).t, TC = sumar(ULTIMO.act, b.tipo).t;
    const d = TA ? Math.round((TC - TA) / TA * 100) : null;
    L.push("");
    L.push(b.titulo.toUpperCase() + ": " + num(TC) + " (" + (d === null ? "—" : (d > 0 ? "+" : "") + d + "%") + " vs semana anterior)");
    ULTIMO.grupos.forEach(function(g){
      const a = (ULTIMO.ant[g] || vacio())[b.tipo].t, c = (ULTIMO.act[g] || vacio())[b.tipo].t;
      const dd = a ? Math.round((c - a) / a * 100) : null;
      L.push("· " + g + ": " + num(c) + " (" + (dd === null ? "—" : (dd > 0 ? "+" : "") + dd + "%") + ")");
    });
  });
  return L.join("\n");
}

function descargarCsv(){
  if (!ULTIMO) return;
  const filas = [];
  const enc = [tituloGrupo(), "Bloque", "Semana " + etiquetaSemana(ULTIMO.semAnt)].concat(DIAS, ["Total " + etiquetaSemana(ULTIMO.sem), "Dif SA %"]);
  filas.push(enc);
  BLOQUES.forEach(function(b){
    ULTIMO.grupos.forEach(function(g){
      const A = (ULTIMO.ant[g] || vacio())[b.tipo], C = (ULTIMO.act[g] || vacio())[b.tipo];
      const d = A.t ? Math.round((C.t - A.t) / A.t * 100) : "";
      filas.push([g, b.titulo, A.t].concat(C.d, [C.t, d]));
    });
    const TA = sumar(ULTIMO.ant, b.tipo), TC = sumar(ULTIMO.act, b.tipo);
    const dT = TA.t ? Math.round((TC.t - TA.t) / TA.t * 100) : "";
    filas.push(["TOTAL", b.titulo, TA.t].concat(TC.d, [TC.t, dT]));
  });
  const csv = "\ufeff" + filas.map(function(f){
    return f.map(function(x){ return '"' + String(x).replace(/"/g, '""') + '"'; }).join(",");
  }).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = "seguimiento_" + ULTIMO.sem + ".csv";
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
}

/* ---------- arranque ---------- */

["semana","agrupar","reglaVal","reglaIns","planVista","matrizMetrica"].forEach(function(id){
  el(id).addEventListener("change", pintar);
});
function abrirCajon(){
  el("cajon").classList.remove("oculto");
  el("fondoMenu").classList.remove("oculto");
}
function cerrarCajon(){
  el("cajon").classList.add("oculto");
  el("fondoMenu").classList.add("oculto");
}
el("btnMenu").addEventListener("click", function(ev){
  ev.stopPropagation();
  if (el("cajon").classList.contains("oculto")) abrirCajon(); else cerrarCajon();
});
el("btnCerrarMenu").addEventListener("click", cerrarCajon);
el("fondoMenu").addEventListener("click", cerrarCajon);

Array.prototype.forEach.call(document.querySelectorAll("[data-vista]"), function(b){
  b.addEventListener("click", function(){
    VISTA = b.getAttribute("data-vista");
    Array.prototype.forEach.call(document.querySelectorAll("[data-vista]"), function(x){
      x.classList.toggle("on", x === b);
    });
    if (window.scrollTo) try { window.scrollTo({ top:0, behavior:"smooth" }); } catch(e){}
    pintar();
  });
});

document.addEventListener("click", cerrarMultis);
document.addEventListener("keydown", function(ev){ if (ev.key === "Escape"){ cerrarMultis(); cerrarCajon(); } });
el("btnRecargar").addEventListener("click", cargar);
["hojaTecnico","idTecnico","colLlave","colClave"].forEach(function(id){
  el(id).addEventListener("change", cargar);
});
el("btnRevisar").addEventListener("click", revisarCruce);
el("btnRevisarEq").addEventListener("click", revisarEquipos);
["gidRanking","gidEntrena","gidPlantilla"].forEach(function(id){
  el(id).addEventListener("change", function(){ INFO_EQ.estado = "sin cargar"; if (VISTA === "equipos") cargarEquipos(); });
});
["metasRanking","semanasMes","umbralPlatino"].forEach(function(id){
  el(id).addEventListener("change", function(){ if (VISTA === "equipos") pintar(); });
});
["lideresLocales","plazasLocales","cruceCampo","clavesTecnico","palabrasAdicional"].forEach(function(id){
  el(id).addEventListener("change", function(){ if (FILAS.length) reclasificarCanal(); });
});
el("btnCsv").addEventListener("click", descargarCsv);
el("btnResumen").addEventListener("click", function(){
  const t = textoResumen();
  if (!t) return;
  const b = el("btnResumen");
  function ok(){ b.textContent = "Copiado"; setTimeout(function(){ b.textContent = "Copiar resumen"; }, 1800); }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(ok, function(){ window.prompt("Copia el resumen:", t); });
  } else {
    window.prompt("Copia el resumen:", t);
  }
});

cargar();
</script>
