<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reporte de seguimiento · La Laguna</title>
<style>
  :root{
    --bg:#eef1f5; --panel:#ffffff; --ink:#101a26; --muted:#5d6b7a;
    --line:#d8dee6; --line2:#eaeef3;
    --azul:#123a5e; --azul2:#1d5b8f; --rojo:#c8102e;
    --v-bg:#d9f0e3; --v-tx:#0e6b45;
    --a-bg:#fdf1cf; --a-tx:#8a6300;
    --r-bg:#fbdfdd; --r-tx:#a91e14;
    --gris:#e9edf2;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:14px; line-height:1.35;
  }
  header{
    background:var(--azul); color:#fff; padding:14px 16px 12px;
    border-bottom:3px solid var(--rojo);
  }
  header h1{margin:0; font-size:17px; letter-spacing:.2px; font-weight:650}
  header p{margin:3px 0 0; font-size:12px; color:#b9cbdc}
  .wrap{max-width:1400px; margin:0 auto; padding:14px 12px 60px}
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:10px; margin-bottom:14px}
  .panel > h2{
    margin:0; padding:10px 14px; font-size:12px; letter-spacing:1.1px;
    text-transform:uppercase; color:var(--azul); border-bottom:1px solid var(--line2);
    display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;
  }
  .panel > h2 span.sub{font-weight:400; letter-spacing:.2px; text-transform:none; color:var(--muted); font-size:12px}
  .controles{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; padding:12px 14px}
  label.campo{display:flex; flex-direction:column; gap:4px; font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted)}
  select,input[type=text]{
    font:inherit; padding:7px 8px; border:1px solid var(--line); border-radius:7px;
    background:#fff; color:var(--ink); width:100%;
  }
  .acciones{display:flex; gap:8px; flex-wrap:wrap; padding:0 14px 12px}
  button{
    font:inherit; font-size:13px; padding:8px 13px; border-radius:7px; cursor:pointer;
    border:1px solid var(--azul); background:var(--azul); color:#fff;
  }
  button.sec{background:#fff; color:var(--azul)}
  button:disabled{opacity:.5; cursor:default}
  button:focus-visible, select:focus-visible, input:focus-visible{outline:2px solid var(--rojo); outline-offset:2px}
  .aviso{padding:10px 14px; font-size:13px; color:var(--muted); border-top:1px solid var(--line2)}
  .aviso b{color:var(--ink)}
  .aviso.error{color:var(--r-tx); background:var(--r-bg)}
  .scroll{overflow-x:auto; -webkit-overflow-scrolling:touch}
  table{border-collapse:collapse; width:100%; min-width:760px; font-variant-numeric:tabular-nums}
  th,td{padding:6px 8px; border-bottom:1px solid var(--line2); text-align:right; white-space:nowrap}
  th:first-child,td:first-child{
    text-align:left; position:sticky; left:0; background:#fff; z-index:1;
    border-right:1px solid var(--line2); max-width:210px; overflow:hidden; text-overflow:ellipsis;
  }
  thead th{
    font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted);
    background:var(--gris); border-bottom:1px solid var(--line);
  }
  thead th:first-child{background:var(--gris)}
  tbody td{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:13px}
  tbody td:first-child{font-family:inherit}
  tr.total td{font-weight:700; background:#f4f7fa; border-top:1px solid var(--line)}
  tr.total td:first-child{background:#f4f7fa}
  td.sem{border-left:1px solid var(--line)}
  td.tot{background:#f2f5f8; font-weight:700}
  td.dif{font-weight:700}
  td.dif.v{background:var(--v-bg); color:var(--v-tx)}
  td.dif.a{background:var(--a-bg); color:var(--a-tx)}
  td.dif.r{background:var(--r-bg); color:var(--r-tx)}
  td.cero{color:#a8b3bf}
  .leyenda{padding:8px 14px 12px; font-size:11.5px; color:var(--muted)}
  .pill{display:inline-block; padding:1px 7px; border-radius:20px; background:var(--gris); margin-right:6px; font-size:11px}
  details.ajustes summary{padding:10px 14px; cursor:pointer; font-size:12px; color:var(--azul); text-transform:uppercase; letter-spacing:1px}
  .oculto{display:none}
  .multi{position:relative}
  .multi-btn{
    width:100%; text-align:left; background:#fff; color:var(--ink); border:1px solid var(--line);
    border-radius:7px; padding:7px 8px; font-size:14px; display:flex; justify-content:space-between; gap:6px; align-items:center;
  }
  .multi-btn .flecha{color:var(--muted); font-size:11px}
  .multi-btn.activo{border-color:var(--azul2); box-shadow:inset 0 0 0 1px var(--azul2)}
  .multi-panel{
    position:absolute; z-index:20; top:calc(100% + 4px); left:0; min-width:100%; max-width:320px;
    background:#fff; border:1px solid var(--line); border-radius:8px; box-shadow:0 8px 22px rgba(16,26,38,.16);
  }
  .multi-acc{display:flex; gap:6px; padding:8px; border-bottom:1px solid var(--line2)}
  .multi-acc button{padding:4px 9px; font-size:12px; background:#fff; color:var(--azul); border:1px solid var(--line)}
  .multi-lista{max-height:260px; overflow:auto; padding:4px 0}
  .multi-lista label{
    display:flex; gap:8px; align-items:center; padding:6px 10px; font-size:13px; cursor:pointer;
    text-transform:none; letter-spacing:0; color:var(--ink); white-space:normal;
  }
  .multi-lista label:hover{background:var(--gris)}
  .multi-lista input{margin:0; flex:none}
  @media (max-width:640px){
    .wrap{padding:10px 8px 50px}
    th,td{padding:5px 6px}
    th:first-child,td:first-child{max-width:130px}
  }
</style>
</head>
<body>
<header>

  <div id="salida"></div>

<script>
"use strict";

/* ---------- utilidades de fecha ---------- */

function soloFecha(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

function isoSemana(d){
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dn = (t.getUTCDay() + 6) % 7;          // 0 = lunes
  t.setUTCDate(t.getUTCDate() - dn + 3);       // jueves de esa semana
  const anio = t.getUTCFullYear();
  const primerJue = new Date(Date.UTC(anio, 0, 4));
  const dn2 = (primerJue.getUTCDay() + 6) % 7;
  primerJue.setUTCDate(primerJue.getUTCDate() - dn2 + 3);
  const sem = 1 + Math.round((t - primerJue) / (7 * 86400000));
  return anio + "-" + String(sem).padStart(2, "0");
}
function lunesDe(clave){
  const [anio, sem] = clave.split("-").map(Number);
  const primerJue = new Date(anio, 0, 4);
  const dn = (primerJue.getDay() + 6) % 7;
  const lunesS1 = new Date(primerJue.getFullYear(), primerJue.getMonth(), primerJue.getDate() - dn);
  return new Date(lunesS1.getFullYear(), lunesS1.getMonth(), lunesS1.getDate() + (sem - 1) * 7);
}
function claveAnterior(clave){
  const l = lunesDe(clave);
  return isoSemana(new Date(l.getFullYear(), l.getMonth(), l.getDate() - 7));
}
function etiquetaSemana(clave){
  const [anio, sem] = clave.split("-");
  return anio + " " + Number(sem);
}
function diaIndice(d){ return (d.getDay() + 6) % 7; }   // 0 = lunes … 6 = domingo
const DIAS = ["lun","mar","mié","jue","vie","sáb","dom"];
function fCorta(d){
  return String(d.getDate()).padStart(2,"0") + "/" + String(d.getMonth()+1).padStart(2,"0") + "/" + d.getFullYear();
}

/* ---------- lectura de la hoja (gviz por JSONP: funciona incluso abriendo el archivo local) ---------- */

function consultaGviz(id, destino, tq, segundos, encabezados){
  return new Promise(function(res, rej){
    const cb = "tp" + Math.random().toString(36).slice(2, 10);
    const s = document.createElement("script");
    let temporizador = null;
    function limpiar(){
      if (temporizador) clearTimeout(temporizador);
      try { delete window[cb]; } catch(e){ window[cb] = undefined; }
      if (s.parentNode) s.parentNode.removeChild(s);
    }
    window[cb] = function(r){
      limpiar();
      if (r && r.status === "error"){
        const d = r.errors && r.errors[0] ? (r.errors[0].detailed_message || r.errors[0].message) : "error desconocido";
        rej(new Error(d.replace(/<[^>]+>/g, "")));
      } else if (!r || !r.table){
        rej(new Error("La hoja respondió sin datos"));
      } else {
        res(r.table);
      }
    };
    let url = "https://docs.google.com/spreadsheets/d/" + encodeURIComponent(id) +
              "/gviz/tq?tqx=out:json;responseHandler:" + cb +
              "&headers=" + (encabezados === undefined ? 1 : encabezados);
    const dest = (destino || "").toString().trim();
    if (dest){
      // acepta el gid suelto, la URL con #gid=... o el nombre de la pestaña
      const m = /[?&#]gid=(\d+)/.exec(dest);
      const g = m ? m[1] : (/^\d+$/.test(dest) ? dest : null);
      url += g ? "&gid=" + g : "&sheet=" + encodeURIComponent(dest);
    }
    url += "&tq=" + encodeURIComponent(tq);
    s.src = url;
    s.onerror = function(){ limpiar(); rej(new Error("No se pudo conectar con la hoja. Revisa el ID y que esté compartida como 'cualquiera con el enlace'.")); };
    temporizador = setTimeout(function(){ limpiar(); rej(new Error("La hoja tardó demasiado en responder")); }, (segundos || 90) * 1000);
    document.head.appendChild(s);
  });
}

function normaliza(s){
  return String(s || "").trim().toUpperCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/\s+/g, " ");
}

/* ---------- estado ---------- */

const COLUMNAS = "C,D,E,F,H,I,K,M,N,O,P,Q,U,AF,AG,AH";
const IDX_SELECT = { cluster:0, creacion:1, validacion:2, activacion:3, canal:4, subcanal:5, estatus:6, estatus2:7, cuenta:8, plan:9, oportunidad:10, vendedor:11, numvendedor:12, director:13, lider:14, coach:15 };
// posiciones reales A..AH, por si hay que leer la hoja completa
const IDX_TODO   = { cluster:2, creacion:3, validacion:4, activacion:5, canal:7, subcanal:8, estatus:10, estatus2:12, cuenta:13, plan:14, oportunidad:15, vendedor:16, numvendedor:20, director:31, lider:32, coach:33 };
let IDX = IDX_SELECT;

let FILAS = [];        // {cluster,canal,canalBase,subcanal,oportunidad,estatus,...,fOp,fVal,fIns}
let SEMANAS = [];      // claves ordenadas
let FECHA_MAX = null;
let TEC_FILAS = [];             // renglones crudos [llave, clave] de la pestaña de venta técnico
let MAPA_TECNICO = new Map();   // llave -> 3 primeras letras (SKA, CRC, …)
let INFO_TECNICO = { estado:"sin cruce", n:0, sinCruce:0 };

const el = function(id){ return document.getElementById(id); };

function avisar(txt, esError){
  const a = el("estado");
  a.innerHTML = txt;
  a.className = "aviso" + (esError ? " error" : "");
}

/* ---------- fechas que llegan como texto ---------- */

function textoAFecha(s, orden){
  const m = /^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/.exec(s.trim());
  if (!m) return null;
  let a = Number(m[1]), b = Number(m[2]), y = Number(m[3]);
  if (y < 100) y += 2000;
  let dia, mes;
  if (orden === "mdy"){ mes = a; dia = b; } else { dia = a; mes = b; }
  if (mes < 1 || mes > 12 || dia < 1 || dia > 31) return null;
  const d = new Date(y, mes - 1, dia);
  return isNaN(d) ? null : d;
}

function detectarOrden(muestras){
  let dmy = 0, mdy = 0;
  for (const s of muestras){
    const m = /^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/.exec(s.trim());
    if (!m) continue;
    const a = Number(m[1]), b = Number(m[2]);
    if (a > 12) dmy++;
    if (b > 12) mdy++;
  }
  return mdy > dmy ? "mdy" : "dmy";
}

function valor(c){
  if (!c) return null;
  const v = c.v;
  if (v === null || v === undefined || v === "") return null;
  return v;
}
function texto(c){
  const v = valor(c);
  if (v === null) return "";
  const s = String(v).trim();
  return (s === "-" || s === "0") ? "" : s;
}

/* ---------- carga ---------- */

/* ---------- canal de ventas: se arma con reglas, no con catálogo ---------- */

function listaAjuste(id){
  return el(id).value.split(";").map(function(s){ return normaliza(s); }).filter(Boolean);
}

function sinCruzar(f){
  return normaliza(f.subcanal).indexOf("VENTA TECNICO") >= 0 &&
         !MAPA_TECNICO.has(llaveDe(f[el("cruceCampo").value]));
}

function canalDe(f){
  const sub = normaliza(f.subcanal);
  const can = normaliza(f.canalBase);

  if (sub === "CAMBACEO" || can === "CAMBACEO"){
    return listaAjuste("lideresLocales").indexOf(normaliza(f.lider)) >= 0 ? "Cambaceo" : "Cambaceo foráneo";
  }

  if (sub.indexOf("VENTA TECNICO") >= 0){
    const cve = MAPA_TECNICO.get(llaveDe(f[el("cruceCampo").value]));
    return (cve && listaAjuste("clavesTecnico").indexOf(cve) >= 0) ? "Venta técnico " + cve : "Venta técnico otros";
  }

  if (can === "PUNTO DE VENTA" || sub.indexOf("PUNTO DE VENTA") >= 0){
    const plazas = listaAjuste("plazasLocales");
    const local = plazas.some(function(p){ return sub.indexOf(p) >= 0; });
    return local ? "Punto de venta" : "Punto de venta foráneo";
  }

  return f.subcanal || f.canalBase || "SIN CANAL";
}

function clave(v){
  if (v === null || v === undefined) return "";
  let s = String(v).trim();
  if (/^\d+\.0+$/.test(s)) s = s.replace(/\.0+$/, "");   // 18913519.0 -> 18913519
  return s.toUpperCase();
}

function llaveDe(valor){
  return el("cruceCampo").value === "vendedor" ? normaliza(valor) : clave(valor);
}

function armarMapaTecnico(){
  MAPA_TECNICO = new Map();
  TEC_FILAS.forEach(function(par){
    const k = llaveDe(par[0]);
    const v = normaliza(par[1]).slice(0, 3);
    if (k && v.length >= 2) MAPA_TECNICO.set(k, v);
  });
  INFO_TECNICO.n = MAPA_TECNICO.size;
}

async function cargarMapaTecnico(id){
  TEC_FILAS = [];
  MAPA_TECNICO = new Map();
  INFO_TECNICO = { estado:"sin cruce", n:0, sinCruce:0, filas:0 };
  const destino = el("hojaTecnico").value.trim();
  if (!destino) return;
  const libro = el("idTecnico").value.trim() || id;
  const a = (el("colLlave").value.trim() || "E").toUpperCase();
  const b = (el("colClave").value.trim() || "F").toUpperCase();
  try{
    const t = await consultaGviz(libro, destino, "select " + a + ", " + b, 90, 0);
    (t.rows || []).forEach(function(r){
      const c = r.c || [];
      const k = c[0] && c[0].v != null ? String(c[0].v) : "";
      const v = c[1] && c[1].v != null ? String(c[1].v) : "";
      if (k.trim() && v.trim()) TEC_FILAS.push([k, v]);
    });
    INFO_TECNICO.filas = TEC_FILAS.length;
    // si llegan fechas en vez de oportunidades, se leyó otra pestaña
    const conFecha = TEC_FILAS.slice(0, 50).filter(function(p){ return /^Date\(/.test(p[0]) || /^Date\(/.test(p[1]); }).length;
    if (TEC_FILAS.length && conFecha > TEC_FILAS.slice(0, 50).length / 2){
      TEC_FILAS = [];
      INFO_TECNICO.estado = "pestaña equivocada";
      INFO_TECNICO.filas = 0;
      return;
    }
    armarMapaTecnico();
    INFO_TECNICO.estado = MAPA_TECNICO.size ? "ok" : "vacío";
  }catch(e){
    INFO_TECNICO.estado = "falló: " + e.message;
  }
}

function revisarCruce(){
  const caja = el("revision");
  caja.classList.remove("oculto");
  const campo = el("cruceCampo").value;
  const tecnicas = FILAS.filter(function(f){ return normaliza(f.subcanal).indexOf("VENTA TECNICO") >= 0; });
  const cruzadas = tecnicas.filter(function(f){ return MAPA_TECNICO.has(llaveDe(f[campo])); });
  const muestraHoja = TEC_FILAS.slice(0, 6).map(function(p){ return p[0] + " &nbsp;→&nbsp; " + p[1]; });
  const muestraBase = tecnicas.slice(0, 6).map(function(f){ return String(f[campo] || "(vacío)"); });
  const claves = Array.from(new Set(Array.from(MAPA_TECNICO.values()))).slice(0, 12);
  const nombreCampo = el("cruceCampo").options[el("cruceCampo").selectedIndex].text;

  caja.innerHTML =
    "<b>Pestaña " + (el("hojaTecnico").value.trim() || "—") + "</b>: " + INFO_TECNICO.filas.toLocaleString("es-MX") +
    " renglones con dato en las columnas " + el("colLlave").value + " y " + el("colClave").value +
    " · " + MAPA_TECNICO.size.toLocaleString("es-MX") + " llaves distintas." +
    "<br><br>Primeros renglones de esa pestaña (llave → clave):<br>" +
    (muestraHoja.length ? muestraHoja.join("<br>") : "ninguno") +
    "<br><br>Claves de 3 letras encontradas: <b>" + (claves.length ? claves.join(", ") : "ninguna") + "</b>" +
    "<br><br>En la base hay <b>" + tecnicas.length.toLocaleString("es-MX") + "</b> renglones de venta técnico y cruzaron <b>" +
    cruzadas.length.toLocaleString("es-MX") + "</b>." +
    "<br>Así se ve el dato que se está cruzando desde la base (" + nombreCampo + "):<br>" +
    (muestraBase.length ? muestraBase.join(" · ") : "ninguno") +
    "<br><br>Si las dos listas no se parecen, cambia en Ajustes la columna llave o el dato de la base que cruza.";
}

function reclasificarCanal(){
  armarMapaTecnico();
  let sinCruce = 0;
  FILAS.forEach(function(f){
    f.canal = canalDe(f);
    if (sinCruzar(f)) sinCruce++;
  });
  INFO_TECNICO.sinCruce = sinCruce;
  llenarMulti("canal");
  pintar();
}

async function cargar(){
  const id = el("hojaId").value.trim();
  const gid = el("hojaGid").value.trim();
  el("btnRecargar").disabled = true;
  avisar("Leyendo la pestaña de venta técnico…");
  await cargarMapaTecnico(id);
  avisar("Leyendo la base… en un archivo grande esto puede tardar medio minuto.");

  let tabla;
  try{
    tabla = await consultaGviz(id, gid, "select " + COLUMNAS, 120);
    IDX = IDX_SELECT;
  }catch(e1){
    try{
      avisar("Reintentando con todas las columnas…");
      tabla = await consultaGviz(id, gid, "select *", 150);
      IDX = IDX_TODO;
    }catch(e2){
      avisar("No se pudo leer la hoja. <b>" + e2.message + "</b>", true);
      el("btnRecargar").disabled = false;
      return;
    }
  }

  const filas = tabla.rows || [];
  // detectar el orden de las fechas cuando vienen como texto
  const muestras = [];
  for (let i = 0; i < filas.length && muestras.length < 4000; i++){
    const c = filas[i].c || [];
    [IDX.creacion, IDX.validacion, IDX.activacion].forEach(function(j){
      if (!c[j]) return;
      const v = c[j].v, f = c[j].f;
      if (typeof v === "string" && v.length >= 6 && !/^Date\(/.test(v)) muestras.push(v);
      if (typeof f === "string" && f.length >= 6) muestras.push(f);
    });
  }
  const orden = detectarOrden(muestras);

  function leerFecha(c){
    if (!c) return null;
    const v = c.v;
    if (v instanceof Date) return isNaN(v) ? null : soloFecha(v);
    if (typeof v === "string"){
      const g = /^Date\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/.exec(v);   // así entrega Google las fechas
      if (g) return new Date(Number(g[1]), Number(g[2]), Number(g[3]));
      const t = textoAFecha(v, orden);
      if (t) return t;
    }
    if (c.f) return textoAFecha(String(c.f), orden);                  // respaldo: el texto mostrado
    return null;
  }

  const nuevas = [];
  const semanas = new Set();
  let sinCruce = 0;
  let max = null;

  for (const f of filas){
    const c = f.c || [];
    const fOp  = leerFecha(c[IDX.creacion]);
    const fVal = leerFecha(c[IDX.validacion]);
    const fIns = leerFecha(c[IDX.activacion]);
    if (!fOp && !fVal && !fIns) continue;

    const reg = {
      cluster:  texto(c[IDX.cluster]),
      canalBase: texto(c[IDX.canal]),
      subcanal: texto(c[IDX.subcanal]),
      oportunidad: c[IDX.oportunidad] && c[IDX.oportunidad].v != null ? c[IDX.oportunidad].v : "",
      numvendedor: c[IDX.numvendedor] && c[IDX.numvendedor].v != null ? c[IDX.numvendedor].v : "",
      cuenta:      c[IDX.cuenta] && c[IDX.cuenta].v != null ? c[IDX.cuenta].v : "",
      estatus:  texto(c[IDX.estatus]),
      estatus2: texto(c[IDX.estatus2]),
      plan:     texto(c[IDX.plan]),
      vendedor: texto(c[IDX.vendedor]),
      director: texto(c[IDX.director]),
      lider:    texto(c[IDX.lider]),
      coach:    texto(c[IDX.coach]),
      fOp: fOp, fVal: fVal, fIns: fIns
    };
    reg.canal = canalDe(reg);
    if (sinCruzar(reg)) sinCruce++;
    nuevas.push(reg);

    [fOp, fVal, fIns].forEach(function(d){
      if (!d) return;
      semanas.add(isoSemana(d));
      if (!max || d > max) max = d;
    });
  }

  INFO_TECNICO.sinCruce = sinCruce;

  FILAS = nuevas;
  FECHA_MAX = max;
  SEMANAS = Array.from(semanas).sort();

  llenarSelectores();

  if (!FILAS.length){
    const c0 = (filas[0] && filas[0].c) || [];
    const muestra = [IDX.creacion, IDX.validacion, IDX.activacion].map(function(j){
      return c0[j] ? JSON.stringify(c0[j].v) : "vacío";
    }).join(" · ");
    avisar("La hoja respondió con <b>" + filas.length.toLocaleString("es-MX") + "</b> renglones, pero ninguno trae fecha reconocible.<br>" +
           "Columnas que llegaron: <b>" + (tabla.cols || []).length + "</b>. Primer renglón, columnas de creación/validación/activación: " +
           muestra + "<br>Si aquí no aparecen fechas, la pestaña que se está leyendo no es la BASE: pon el gid de la pestaña en Ajustes.", true);
    el("btnRecargar").disabled = false;
    return;
  }

  let nota = "";
  if (INFO_TECNICO.estado === "ok"){
    nota = "<br>Venta técnico cruzado con <b>" + el("hojaTecnico").value.trim() + "</b> (" + INFO_TECNICO.n.toLocaleString("es-MX") + " referencias)";
    if (INFO_TECNICO.sinCruce) nota += " · <b>" + INFO_TECNICO.sinCruce + "</b> ventas técnico sin cruce, se van a “Venta técnico otros”";
  } else if (INFO_TECNICO.estado === "pestaña equivocada"){
    nota = "<br><b>Google devolvió otra pestaña</b>: en las columnas " + el("colLlave").value + " y " + el("colClave").value +
           " llegaron fechas, no oportunidades. Abre la pestaña VENTA TECNICO en Google Sheets, copia el <b>gid</b> de la barra de direcciones " +
           "(la parte gid=…) y pégalo en Ajustes en lugar del nombre.";
  } else if (INFO_TECNICO.estado !== "sin cruce"){
    nota = "<br>No se pudo leer la pestaña de venta técnico (" + INFO_TECNICO.estado + "): esas ventas salen como “Venta técnico otros”.";
  }

  avisar("<b>" + FILAS.length.toLocaleString("es-MX") + "</b> registros con fecha, de " + filas.length.toLocaleString("es-MX") + " renglones · fechas en formato " +
         (orden === "mdy" ? "mes/día/año" : "día/mes/año") +
         (max ? " · último movimiento el <b>" + fCorta(max) + "</b> (semana " + etiquetaSemana(isoSemana(max)) + ")" : "") + nota);
  el("btnRecargar").disabled = false;
  pintar();
}

function llenarSelectores(){
  const sem = el("semana");
  const previo = sem.value;
  sem.innerHTML = "";
  SEMANAS.slice().reverse().forEach(function(k){
    const o = document.createElement("option");
    o.value = k;
    o.textContent = "Semana " + etiquetaSemana(k) + "  ·  " + fCorta(lunesDe(k)) + " al " + fCorta(new Date(lunesDe(k).getFullYear(), lunesDe(k).getMonth(), lunesDe(k).getDate() + 6));
    sem.appendChild(o);
  });
  sem.value = (previo && SEMANAS.indexOf(previo) >= 0) ? previo : (FECHA_MAX ? isoSemana(FECHA_MAX) : SEMANAS[SEMANAS.length - 1]);

  llenarMulti("director");
  llenarMulti("lider");
  llenarMulti("canal");
}

/* ---------- filtros de selección múltiple ---------- */

const MULTI = {
  director: { contId:"fDirector", sel:new Set(), valores:[] },
  lider:    { contId:"fLider",    sel:new Set(), valores:[] },
  canal:    { contId:"fCanal",    sel:new Set(), valores:[] }
};

function armarMulti(campo){
  const m = MULTI[campo];
  if (m.armado) return;
  const c = el(m.contId);
  c.className = "multi";
  c.innerHTML =
    '<button type="button" class="multi-btn"><span class="etq">Todos</span><span class="flecha">▾</span></button>' +
    '<div class="multi-panel oculto">' +
      '<div class="multi-acc"><button type="button" data-acc="todos">Todos</button>' +
      '<button type="button" data-acc="solo">Quitar todos</button></div>' +
      '<div class="multi-lista"></div>' +
    "</div>";
  m.btn = c.querySelector(".multi-btn");
  m.etq = c.querySelector(".etq");
  m.panel = c.querySelector(".multi-panel");
  m.lista = c.querySelector(".multi-lista");

  m.btn.addEventListener("click", function(ev){
    ev.preventDefault(); ev.stopPropagation();
    const abierto = !m.panel.classList.contains("oculto");
    cerrarMultis();
    if (!abierto){ m.panel.classList.remove("oculto"); m.btn.classList.add("activo"); }
  });
  m.panel.addEventListener("click", function(ev){ ev.stopPropagation(); });
  c.querySelectorAll("[data-acc]").forEach(function(b){
    b.addEventListener("click", function(ev){
      ev.preventDefault();
      m.sel = new Set(b.getAttribute("data-acc") === "todos" ? [] : ["\u0000"]);
      pintarMulti(campo);
      cascada(campo);
      pintar();
    });
  });
  m.armado = true;
}

function llenarMulti(campo){
  armarMulti(campo);
  const m = MULTI[campo];
  m.valores = Array.from(new Set(FILAS.filter(function(f){
    return visiblePara(campo, f);
  }).map(function(f){ return f[campo]; }).filter(Boolean))).sort(function(a,b){ return a.localeCompare(b, "es"); });

  // conservar solo lo que sigue existiendo
  const nueva = new Set();
  m.sel.forEach(function(v){ if (v === "\u0000" || m.valores.indexOf(v) >= 0) nueva.add(v); });
  m.sel = nueva;

  m.lista.innerHTML = "";
  m.valores.forEach(function(v){
    const lab = document.createElement("label");
    const chk = document.createElement("input");
    chk.type = "checkbox";
    chk.checked = m.sel.has(v);
    chk.addEventListener("change", function(){
      m.sel.delete("\u0000");
      if (chk.checked) m.sel.add(v); else m.sel.delete(v);
      pintarMulti(campo);
      cascada(campo);
      pintar();
    });
    const txt = document.createElement("span");
    txt.textContent = v;
    lab.appendChild(chk); lab.appendChild(txt);
    m.lista.appendChild(lab);
  });
  pintarMulti(campo);
}

function pintarMulti(campo){
  const m = MULTI[campo];
  let t;
  if (m.sel.has("\u0000")) t = "Ninguno";
  else if (m.sel.size === 0) t = "Todos";
  else if (m.sel.size === 1) t = Array.from(m.sel)[0];
  else t = m.sel.size + " seleccionados";
  m.etq.textContent = t;
  m.etq.title = m.sel.size && !m.sel.has("\u0000") ? Array.from(m.sel).join(", ") : t;
}

// al mover director se recalcula la lista de líderes, y así hacia abajo
function cascada(campo){
  if (campo === "director") llenarMulti("lider");
}

function visiblePara(campo, f){
  if (campo === "lider") return cumple("director", f);
  return true;
}

function cumple(campo, f){
  const m = MULTI[campo];
  if (!m || m.sel.size === 0) return true;
  if (m.sel.has("\u0000")) return false;
  return m.sel.has(f[campo]);
}

function cerrarMultis(){
  Object.keys(MULTI).forEach(function(k){
    const m = MULTI[k];
    if (m.panel){ m.panel.classList.add("oculto"); m.btn.classList.remove("activo"); }
  });
}

function seleccionTexto(campo){
  const m = MULTI[campo];
  if (!m || m.sel.size === 0) return "";
  if (m.sel.has("\u0000")) return "ninguno";
  return Array.from(m.sel).join(" + ");
}

/* ---------- reglas de conteo ---------- */

function esValidada(f){
  const regla = el("reglaVal").value;
  const conFecha = !!f.fVal;
  const conEstatus = /valid/i.test(f.estatus);
  if (regla === "estatus") return conEstatus;
  if (regla === "ambos") return conFecha && conEstatus;
  return conFecha;
}
function esInstalada(f){
  if (!f.fIns) return false;
  if (el("reglaIns").value === "completado") return /complet/i.test(f.estatus2);
  return true;
}

function pasaFiltros(f){
  if (!cumple("director", f)) return false;
  if (!cumple("lider", f)) return false;
  if (!cumple("canal", f)) return false;
  if (el("fSinAsignar").value === "fuera"){
    const campo = el("agrupar").value;
    if (["lider","director","coach"].indexOf(campo) >= 0 && !f[campo]) return false;
  }
  return true;
}

function grupoDe(f){
  const campo = el("agrupar").value;
  return f[campo] || "SIN ASIGNAR";
}

/* ---------- agregación ---------- */

function agregar(claveSem){
  // devuelve {grupo: {op:{d:[7],t}, val:{...}, ins:{...}}}
  const acc = {};
  function bolsa(g, tipo){
    if (!acc[g]) acc[g] = { op:{d:[0,0,0,0,0,0,0],t:0}, val:{d:[0,0,0,0,0,0,0],t:0}, ins:{d:[0,0,0,0,0,0,0],t:0} };
    return acc[g][tipo];
  }
  for (const f of FILAS){
    if (!pasaFiltros(f)) continue;
    const g = grupoDe(f);
    if (f.fOp && isoSemana(f.fOp) === claveSem){
      const b = bolsa(g, "op"); b.d[diaIndice(f.fOp)]++; b.t++;
    }
    if (esValidada(f) && f.fVal && isoSemana(f.fVal) === claveSem){
      const b = bolsa(g, "val"); b.d[diaIndice(f.fVal)]++; b.t++;
    }
    if (esInstalada(f) && isoSemana(f.fIns) === claveSem){
      const b = bolsa(g, "ins"); b.d[diaIndice(f.fIns)]++; b.t++;
    }
  }
  return acc;
}

function vacio(){ return { op:{d:[0,0,0,0,0,0,0],t:0}, val:{d:[0,0,0,0,0,0,0],t:0}, ins:{d:[0,0,0,0,0,0,0],t:0} }; }

function sumar(acc, tipo){
  const r = {d:[0,0,0,0,0,0,0], t:0};
  Object.keys(acc).forEach(function(g){
    for (let i=0;i<7;i++) r.d[i] += acc[g][tipo].d[i];
    r.t += acc[g][tipo].t;
  });
  return r;
}

/* ---------- pintado ---------- */

const BLOQUES = [
  { tipo:"op",  titulo:"Oportunidad",   nota:"por fecha de creación" },
  { tipo:"val", titulo:"Venta validada", nota:"por fecha de validación" },
  { tipo:"ins", titulo:"Instalaciones",  nota:"por fecha de activación" }
];

let ULTIMO = null;   // para CSV y resumen

function pintar(){
  if (!FILAS.length){ el("salida").innerHTML = ""; return; }

  const sem = el("semana").value;
  const semAnt = claveAnterior(sem);
  const lunes = lunesDe(sem);
  const domingo = new Date(lunes.getFullYear(), lunes.getMonth(), lunes.getDate() + 6);

  const act = agregar(sem);
  const ant = agregar(semAnt);

  const grupos = Array.from(new Set(Object.keys(act).concat(Object.keys(ant))));
  grupos.sort(function(a,b){
    const ta = (act[a] || vacio()).ins.t + (act[a] || vacio()).op.t;
    const tb = (act[b] || vacio()).ins.t + (act[b] || vacio()).op.t;
    if (tb !== ta) return tb - ta;
    return a.localeCompare(b, "es");
  });

  // días con datos dentro de la semana seleccionada
  let diasCorridos = 7, enCurso = false;
  if (FECHA_MAX && FECHA_MAX < domingo){
    enCurso = true;
    diasCorridos = FECHA_MAX < lunes ? 0 : diaIndice(FECHA_MAX) + 1;
  }

  ULTIMO = { sem:sem, semAnt:semAnt, grupos:grupos, act:act, ant:ant, enCurso:enCurso, diasCorridos:diasCorridos };

  let html = "";

  BLOQUES.forEach(function(b){
    html += bloqueHtml(b, grupos, act, ant, sem, semAnt, enCurso, diasCorridos);
  });

  html += conversionHtml("Conversión · validadas sobre oportunidad", "val", "op", grupos, act, ant, sem, semAnt);
  html += conversionHtml("Conversión · instalaciones sobre validadas", "ins", "val", grupos, act, ant, sem, semAnt);

  el("salida").innerHTML = html;
  const filtros = ["director","lider","canal"].map(function(c){
    const t = seleccionTexto(c);
    return t ? (c === "lider" ? "líder" : c) + ": " + t : "";
  }).filter(Boolean).join(" · ");
  el("rango").textContent = "Semana " + etiquetaSemana(sem) + ": " + fCorta(lunes) + " al " + fCorta(domingo) +
    (enCurso ? " · semana abierta, " + diasCorridos + " día(s) con datos" : " · semana cerrada") +
    (filtros ? " · " + filtros : "");
}

function claseSemaforo(v, valores){
  if (v === null) return "";
  const ord = valores.filter(function(x){ return x !== null; }).slice().sort(function(a,b){ return b - a; });
  if (ord.length < 2) return "";
  if (v === ord[0]) return " v";
  if (v === ord[ord.length - 1]) return " r";
  return " a";
}

function num(n){ return n ? n.toLocaleString("es-MX") : "0"; }
function celdaNum(n, extra){
  return '<td class="' + (extra||"") + (n ? "" : " cero") + '">' + num(n) + "</td>";
}
function pct(x){ return (x === null || !isFinite(x)) ? "—" : Math.round(x * 100) + "%"; }

function bloqueHtml(b, grupos, act, ant, sem, semAnt, enCurso, diasCorridos){
  const difs = grupos.map(function(g){
    const a = (ant[g] || vacio())[b.tipo].t, c = (act[g] || vacio())[b.tipo].t;
    return a ? (c - a) / a : null;
  });

  let filas = "";
  grupos.forEach(function(g, i){
    const A = (ant[g] || vacio())[b.tipo], C = (act[g] || vacio())[b.tipo];
    const proy = enCurso && diasCorridos > 0 ? Math.round(C.t / diasCorridos * 7) : C.t;
    filas += "<tr><td>" + g + "</td>" + celdaNum(A.t, "sem") +
             C.d.map(function(n, j){ return celdaNum(n, j === 0 ? "sem" : ""); }).join("") +
             celdaNum(C.t, "tot") +
             '<td class="dif' + claseSemaforo(difs[i], difs) + '">' + pct(difs[i]) + "</td>" +
             celdaNum(proy) + "</tr>";
  });

  const TA = sumar(ant, b.tipo), TC = sumar(act, b.tipo);
  const difT = TA.t ? (TC.t - TA.t) / TA.t : null;
  const proyT = enCurso && diasCorridos > 0 ? Math.round(TC.t / diasCorridos * 7) : TC.t;
  filas += '<tr class="total"><td>Total</td>' + celdaNum(TA.t, "sem") +
           TC.d.map(function(n, j){ return celdaNum(n, j === 0 ? "sem" : ""); }).join("") +
           celdaNum(TC.t, "tot") + '<td class="dif">' + pct(difT) + "</td>" + celdaNum(proyT) + "</tr>";

  return '<section class="panel"><h2>' + b.titulo.toUpperCase() +
         ' <span class="sub">' + b.nota + '</span></h2><div class="scroll"><table>' +
         "<thead><tr><th>" + tituloGrupo() + "</th>" +
         '<th class="sem">' + etiquetaSemana(semAnt) + "</th>" +
         DIAS.map(function(d, j){ return "<th" + (j === 0 ? ' class="sem"' : "") + ">" + d + "</th>"; }).join("") +
         '<th class="tot">Total ' + etiquetaSemana(sem) + "</th><th>Dif SA</th><th>Proy</th></tr></thead><tbody>" +
         filas + "</tbody></table></div></section>";
}

function conversionHtml(titulo, arriba, abajo, grupos, act, ant, sem, semAnt){
  function razon(o, tipoA, tipoB){
    const b = o[tipoB].t;
    return b ? o[tipoA].t / b : null;
  }
  let filas = "";
  grupos.forEach(function(g){
    const A = ant[g] || vacio(), C = act[g] || vacio();
    let celdas = "";
    for (let i = 0; i < 7; i++){
      const den = C[abajo].d[i];
      celdas += "<td" + (i === 0 ? ' class="sem"' : "") + ">" + (den ? Math.round(C[arriba].d[i] / den * 100) + "%" : "—") + "</td>";
    }
    filas += "<tr><td>" + g + "</td>" +
             '<td class="sem">' + pct(razon(A, arriba, abajo)) + "</td>" +
             celdas +
             '<td class="tot">' + pct(razon(C, arriba, abajo)) + "</td></tr>";
  });

  const sa = { op: sumar(ant, "op"), val: sumar(ant, "val"), ins: sumar(ant, "ins") };
  const sc = { op: sumar(act, "op"), val: sumar(act, "val"), ins: sumar(act, "ins") };
  let celdasT = "";
  for (let i = 0; i < 7; i++){
    const den = sc[abajo].d[i];
    celdasT += "<td" + (i === 0 ? ' class="sem"' : "") + ">" + (den ? Math.round(sc[arriba].d[i] / den * 100) + "%" : "—") + "</td>";
  }
  filas += '<tr class="total"><td>Total</td><td class="sem">' + pct(sa[abajo].t ? sa[arriba].t / sa[abajo].t : null) + "</td>" +
           celdasT + '<td class="tot">' + pct(sc[abajo].t ? sc[arriba].t / sc[abajo].t : null) + "</td></tr>";

  return '<section class="panel"><h2>' + titulo.toUpperCase() +
         ' <span class="sub">cada día se compara contra el mismo día, por eso puede pasar de 100%</span></h2>' +
         '<div class="scroll"><table><thead><tr><th>' + tituloGrupo() + "</th>" +
         '<th class="sem">' + etiquetaSemana(semAnt) + "</th>" +
         DIAS.map(function(d, j){ return "<th" + (j === 0 ? ' class="sem"' : "") + ">" + d + "</th>"; }).join("") +
         '<th class="tot">' + etiquetaSemana(sem) + "</th></tr></thead><tbody>" + filas + "</tbody></table></div></section>";
}

function tituloGrupo(){
  const s = el("agrupar");
  return s.options[s.selectedIndex].text;
}

/* ---------- salidas ---------- */

function textoResumen(){
  if (!ULTIMO) return "";
  const L = [];
  L.push("SEGUIMIENTO SEMANA " + etiquetaSemana(ULTIMO.sem) + " (vs " + etiquetaSemana(ULTIMO.semAnt) + ")");
  ["director","lider","canal"].forEach(function(c){
    const t = seleccionTexto(c);
    if (t) L.push((c === "lider" ? "Líder" : c === "canal" ? "Canal" : "Director") + ": " + t);
  });
  if (ULTIMO.enCurso) L.push("Semana abierta con " + ULTIMO.diasCorridos + " día(s) de información.");
  BLOQUES.forEach(function(b){
    const TA = sumar(ULTIMO.ant, b.tipo).t, TC = sumar(ULTIMO.act, b.tipo).t;
    const d = TA ? Math.round((TC - TA) / TA * 100) : null;
    L.push("");
    L.push(b.titulo.toUpperCase() + ": " + num(TC) + " (" + (d === null ? "—" : (d > 0 ? "+" : "") + d + "%") + " vs semana anterior)");
    ULTIMO.grupos.forEach(function(g){
      const a = (ULTIMO.ant[g] || vacio())[b.tipo].t, c = (ULTIMO.act[g] || vacio())[b.tipo].t;
      const dd = a ? Math.round((c - a) / a * 100) : null;
      L.push("· " + g + ": " + num(c) + " (" + (dd === null ? "—" : (dd > 0 ? "+" : "") + dd + "%") + ")");
    });
  });
  return L.join("\n");
}

function descargarCsv(){
  if (!ULTIMO) return;
  const filas = [];
  const enc = [tituloGrupo(), "Bloque", "Semana " + etiquetaSemana(ULTIMO.semAnt)].concat(DIAS, ["Total " + etiquetaSemana(ULTIMO.sem), "Dif SA %"]);
  filas.push(enc);
  BLOQUES.forEach(function(b){
    ULTIMO.grupos.forEach(function(g){
      const A = (ULTIMO.ant[g] || vacio())[b.tipo], C = (ULTIMO.act[g] || vacio())[b.tipo];
      const d = A.t ? Math.round((C.t - A.t) / A.t * 100) : "";
      filas.push([g, b.titulo, A.t].concat(C.d, [C.t, d]));
    });
    const TA = sumar(ULTIMO.ant, b.tipo), TC = sumar(ULTIMO.act, b.tipo);
    const dT = TA.t ? Math.round((TC.t - TA.t) / TA.t * 100) : "";
    filas.push(["TOTAL", b.titulo, TA.t].concat(TC.d, [TC.t, dT]));
  });
  const csv = "\ufeff" + filas.map(function(f){
    return f.map(function(x){ return '"' + String(x).replace(/"/g, '""') + '"'; }).join(",");
  }).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = "seguimiento_" + ULTIMO.sem + ".csv";
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
}

/* ---------- arranque ---------- */

["semana","agrupar","fSinAsignar","reglaVal","reglaIns"].forEach(function(id){
  el(id).addEventListener("change", pintar);
});
document.addEventListener("click", cerrarMultis);
document.addEventListener("keydown", function(ev){ if (ev.key === "Escape") cerrarMultis(); });
el("btnRecargar").addEventListener("click", cargar);
["hojaTecnico","idTecnico","colLlave","colClave"].forEach(function(id){
  el(id).addEventListener("change", cargar);
});
el("btnRevisar").addEventListener("click", revisarCruce);
["lideresLocales","plazasLocales","cruceCampo","clavesTecnico"].forEach(function(id){
  el(id).addEventListener("change", function(){ if (FILAS.length) reclasificarCanal(); });
});
el("btnCsv").addEventListener("click", descargarCsv);
el("btnResumen").addEventListener("click", function(){
  const t = textoResumen();
  if (!t) return;
  const b = el("btnResumen");
  function ok(){ b.textContent = "Copiado"; setTimeout(function(){ b.textContent = "Copiar resumen"; }, 1800); }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(ok, function(){ window.prompt("Copia el resumen:", t); });
  } else {
    window.prompt("Copia el resumen:", t);
  }
});

cargar();
</script>
</body>
</html>
